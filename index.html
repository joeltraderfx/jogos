<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sala Interativa</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap');

:root {
  --panel: #12131a; --panel-2: #191b24;
  --gold: #e8b84b; --gold-bright: #ffd876;
  --success: #2fa98c; --danger: #d1352b;
  --cream: #f4ede1; --cream-dim: #9a958d;
  --border: rgba(232,184,75,0.22);
}

* { box-sizing: border-box; touch-action: manipulation; }
body {
  margin: 0; padding: 10px;
  background: radial-gradient(ellipse 90% 60% at 50% -10%, #1c2b3f 0%, #0a0b10 55%);
  min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--cream);
  display: flex; justify-content: center;
}

.app { width: 100%; max-width: 950px; }
h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; text-align: center; margin: 0 0 10px; }

.screen { display: none; }
.screen.active { display: block; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }

.text-input { width: 100%; background: #08090d; border: 1.5px solid var(--border); color: var(--cream); font-size: 16px; padding: 12px; border-radius: 8px; }
.code-input { text-align: center; font-family: monospace; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.big-btn {
  flex: 1; min-width: 130px; height: 48px; border: none; border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; cursor: pointer; color: #fff;
}
.big-btn.primary { background: linear-gradient(180deg, var(--success) 0%, #1f7d68 100%); }
.big-btn.accent { background: linear-gradient(180deg, var(--gold) 0%, #a9781f 100%); color: #1a1200; }
.big-btn.meeting { background: linear-gradient(180deg, #3f7fd1 0%, #1c4b82 100%); }

.video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top:10px; }
.video-card { position: relative; background: #000; border-radius: 10px; border: 1.5px solid var(--border); aspect-ratio: 4/3; overflow: hidden; }
.video-card video { width: 100%; height: 100%; object-fit: cover; }
.video-card .tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 6px; font-size: 14px; color: var(--gold-bright); font-weight: bold; z-index: 2; border: 1px solid var(--border); }

.subtitles { position: absolute; bottom: 12px; left: 4%; width: 92%; text-align: center; background: rgba(0,0,0,0.9); color: #fff; font-size: 16px; padding: 10px; border-radius: 8px; z-index: 3; display: none; border: 1px solid var(--gold); }
.subtitles.active { display: block; }
.sub-translated { color: var(--gold-bright); font-weight: 700; margin-top: 4px; font-size: 18px; line-height: 1.2; }

.translation-bar { background: var(--panel-2); padding: 12px; border-radius: 10px; border: 1px solid #3f7fd1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-size: 14px; }
select { background: #000; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 14px; }

@media (max-width: 600px) {
  .subtitles { font-size: 15px; }
  .sub-translated { font-size: 17px; }
  .translation-bar { flex-direction: column; align-items: stretch; }
  select { width: 100%; }
}
</style>
</head>
<body>

<div class="app">
  <h1>SALA <span style="color:var(--gold-bright)">INTERATIVA</span></h1>

  <section class="screen active" id="screen-home">
    <div class="card">
      <label style="font-size: 13px; color: var(--cream-dim);">SEU NOME</label>
      <input class="text-input" id="userNameInput" placeholder="Ex: Joel / Sophia..." maxlength="16">
      
      <div style="margin-top: 12px;">
        <label style="font-size: 13px; color: var(--cream-dim);">CÓDIGO DA SALA (4 DIGITOS)</label>
        <input class="text-input code-input" id="roomCodeInput" maxlength="4" placeholder="1900">
      </div>
      
      <div class="btn-group">
        <button class="big-btn primary" id="btnJoin">Entrar na Sala</button>
        <button class="big-btn accent" id="btnCreate">Criar Sala</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-room">
    <div class="card" style="text-align:center;">
      <div style="font-size:12px; color:var(--cream-dim);">CÓDIGO DA SALA</div>
      <h2 id="lblRoomCode" style="font-size:36px; color:var(--gold-bright); margin:0;">----</h2>
      
      <div class="btn-group" style="justify-content: center;">
        <button class="big-btn meeting" id="btnStartMedia">📸 ATIVAR MINHA CÂMERA E ÁUDIO</button>
      </div>
    </div>

    <div class="translation-bar">
      <strong>🌐 Tradução Simultânea:</strong>
      <label>Eu falo:</label>
      <select id="myLang">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en-US">Inglês (EUA)</option>
        <option value="es-ES">Espanhol</option>
      </select>
      
      <label>Traduzir para:</label>
      <select id="targetLang">
        <option value="en">Inglês</option>
        <option value="pt">Português</option>
        <option value="es">Espanhol</option>
      </select>
      
      <button id="btnStartTranslate" style="background:var(--success); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">Ativar Legendas</button>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3 style="margin:0 0 8px; font-size:15px; text-align:left; color:var(--cream-dim);">PARTICIPANTES NA SALA</h3>
      <div class="video-grid" id="videoGrid"></div>
    </div>
  </section>
</div>

<script>
(function(){
  let peer = null;
  let localStream = null;
  let myName = '';
  let roomCode = '';
  let myPeerId = '';
  let isHost = false;
  const activeConns = {};

  const userNameInput = document.getElementById('userNameInput');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const videoGrid = document.getElementById('videoGrid');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isTranslating = false;

  // Configuração com servidores STUN públicos do Google para liberar conexão entre redes de celular
  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  document.getElementById('btnCreate').addEventListener('click', () => {
    const code = roomCodeInput.value.trim() || Math.floor(1000 + Math.random() * 9000).toString();
    isHost = true;
    startRoom(code);
  });

  document.getElementById('btnJoin').addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if(code.length !== 4) return alert('Digite o código de 4 dígitos!');
    isHost = false;
    startRoom(code);
  });

  function startRoom(code) {
    myName = userNameInput.value.trim() || 'Usuário';
    roomCode = code;
    
    // O Host assume o ID fixo da sala. O Cliente gera um ID único.
    myPeerId = isHost ? 'sala-' + roomCode : 'sala-' + roomCode + '-' + Math.random().toString(36).substr(2, 5);
    peer = new Peer(myPeerId, peerConfig);

    peer.on('open', () => {
      document.getElementById('lblRoomCode').textContent = roomCode;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-room').classList.add('active');
    });

    peer.on('error', (err) => {
      if(err.type === 'unavailable-id') {
        alert('Essa sala já foi criada! Clique em "Entrar na Sala".');
      }
    });

    // Receber conexões de dados (Legendas/Nomes)
    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    // Receber chamadas de mídia (Vídeo)
    peer.on('call', (call) => {
      call.answer(localStream);
      call.on('stream', (remoteStream) => {
        addVideoFeed(call.peer, call.metadata?.name || 'Conectado', remoteStream);
      });
    });
  }

  document.getElementById('btnStartMedia').addEventListener('click', async () => {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      addVideoFeed(myPeerId, myName + ' (Você)', localStream, true);
      document.getElementById('btnStartMedia').style.display = 'none';

      // Se for participante (cliente), conecta imediatamente ao Host da sala
      if(!isHost) {
        const hostPeerId = 'sala-' + roomCode;
        const conn = peer.connect(hostPeerId);
        setupConnection(conn);

        const call = peer.call(hostPeerId, localStream, { metadata: { name: myName } });
        call.on('stream', (remoteStream) => {
          addVideoFeed(hostPeerId, 'Anfitrião', remoteStream);
        });
      }
    } catch(e) {
      alert('Autorize a câmera e o microfone nas configurações do seu navegador.');
    }
  });

  function setupConnection(conn) {
    activeConns[conn.peer] = conn;

    conn.on('open', () => {
      conn.send({ type: 'identity', name: myName, peerId: myPeerId });
      
      // Se eu sou o Host e outro participante entrou, ligo de volta para ele para enviar meu vídeo
      if(isHost && localStream) {
        const call = peer.call(conn.peer, localStream, { metadata: { name: myName } });
        call.on('stream', (remoteStream) => {
          addVideoFeed(conn.peer, 'Participante', remoteStream);
        });
      }
    });

    conn.on('data', (data) => {
      if(data.type === 'identity') {
        updateVideoTag(data.peerId, data.name);
      }
      if(data.type === 'subtitle') {
        showSubtitle(data.peerId, data.original, data.translated);
      }
    });
  }

  function addVideoFeed(id, label, stream, isMuted = false) {
    if(document.getElementById('vcard-' + id)) return;

    const card = document.createElement('div');
    card.className = 'video-card';
    card.id = 'vcard-' + id;

    const video = document.createElement('video');
    video.autoplay = true; video.playsInline = true; video.muted = isMuted;
    video.srcObject = stream;

    const tag = document.createElement('div');
    tag.className = 'tag'; tag.id = 'tag-' + id; tag.textContent = label;

    const subs = document.createElement('div');
    subs.className = 'subtitles'; subs.id = 'subs-' + id;

    card.appendChild(video); card.appendChild(tag); card.appendChild(subs);
    videoGrid.appendChild(card);
  }

  function updateVideoTag(id, name) {
    const tag = document.getElementById('tag-' + id);
    if(tag) tag.textContent = name;
  }

  // RECONHECIMENTO DE VOZ E TRADUÇÃO SIMULTÂNEA
  document.getElementById('btnStartTranslate').addEventListener('click', () => {
    if(!SpeechRecognition) return alert('Utilize o navegador Google Chrome no celular.');

    if(isTranslating) {
      if(recognition) recognition.stop();
      isTranslating = false;
      document.getElementById('btnStartTranslate').textContent = "Ativar Legendas";
      document.getElementById('btnStartTranslate').style.background = "var(--success)";
      return;
    }

    isTranslating = true;
    document.getElementById('btnStartTranslate').textContent = "Parar Legendas";
    document.getElementById('btnStartTranslate').style.background = "var(--danger)";

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = document.getElementById('myLang').value;

    recognition.onresult = async (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.trim();
      if(!transcript || transcript.length < 2) return;

      const targetLang = document.getElementById('targetLang').value;
      const sourceLang = recognition.lang.split('-')[0];

      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${sourceLang}|${targetLang}`);
        const data = await res.json();
        
        if(data && data.responseData && data.responseData.translatedText) {
          const translatedText = data.responseData.translatedText;
          if(translatedText.includes("NO QUERY SPECIFIED")) return;

          showSubtitle(myPeerId, transcript, translatedText);

          Object.values(activeConns).forEach(conn => {
            if(conn.open) {
              conn.send({ type: 'subtitle', peerId: myPeerId, original: transcript, translated: translatedText });
            }
          });
        }
      } catch(e) {}
    };

    recognition.onend = () => { if(isTranslating) recognition.start(); };
    recognition.start();
  });

  let subtitleTimers = {};
  function showSubtitle(peerId, original, translated) {
    const subEl = document.getElementById('subs-' + peerId);
    if(!subEl) return;

    subEl.innerHTML = `<div>${original}</div><div class="sub-translated">${translated}</div>`;
    subEl.classList.add('active');

    clearTimeout(subtitleTimers[peerId]);
    subtitleTimers[peerId] = setTimeout(() => { subEl.classList.remove('active'); }, 6000);
  }

})();
</script>
</body>
</html>
