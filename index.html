<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pênalti Decisivo — Disputa Multiplayer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --sky-top:#0a1626; --sky-bottom:#2c4f74;
  --grass-1:#2f7d3a; --grass-2:#276b31;
  --line:#f2f7ee;
  --gold:#e8b84b; --gold-bright:#ffd876;
  --success:#2fa98c; --danger:#d1352b;
  --panel:#12131a; --panel-2:#191b24; --panel-3:#20222e;
  --cream:#f4ede1; --cream-dim:#9a958d;
  --border:rgba(232,184,75,0.18);
  --accent:#e8b84b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse 90% 60% at 50% -10%, #1c2b3f 0%, #0a0b10 55%);
  min-height:100vh;
  font-family:'Inter',sans-serif;
  color:var(--cream);
  display:flex; justify-content:center;
  padding:18px 10px 40px;
}
.app{width:100%; max-width:560px;}
h1,h2,.display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em;}
button{font-family:'Inter',sans-serif;}

.screen{display:none;}
.screen.active{display:block;}

/* ---------- shared bits ---------- */
.eyebrow{font-size:11px; letter-spacing:0.35em; color:var(--gold); text-transform:uppercase; margin-bottom:2px; text-align:center;}
.subtitle{font-size:12px; color:var(--cream-dim); text-align:center;}
.demo-badge{display:block; width:fit-content; margin:8px auto 0; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--success); border:1px solid rgba(47,169,140,0.4); background:rgba(47,169,140,0.08); padding:3px 10px; border-radius:20px;}

.big-btn{width:100%; height:56px; border:none; border-radius:12px; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.08em; cursor:pointer; margin-top:10px; box-shadow:0 6px 0 rgba(0,0,0,0.35); transition:transform .06s;}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.35);}
.big-btn.primary{background:linear-gradient(180deg,var(--success) 0%, #1f7d68 100%); color:#fff;}
.big-btn.accent{background:linear-gradient(180deg,var(--gold) 0%, #a9781f 100%); color:#1a1200;}
.big-btn:disabled{opacity:0.4; cursor:not-allowed;}

.field-label{font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--cream-dim); margin:16px 0 6px;}
.text-input{width:100%; background:var(--panel); border:1.5px solid var(--border); color:var(--cream); font-size:15px; padding:12px 14px; border-radius:10px; font-family:'Inter',sans-serif;}
.text-input:focus{outline:none; border-color:var(--gold-bright);}
.code-input{text-align:center; font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.4em; text-transform:uppercase;}

.divider{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--cream-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.15em;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}

.home-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px;}

/* ---------- badge/logo ---------- */
.casa-badge-wrap{display:flex; flex-direction:column; align-items:center; margin:18px 0 6px;}
.casa-emblem{width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:26px; color:#151515; box-shadow:0 10px 24px -10px rgba(0,0,0,0.6), inset 0 0 0 3px rgba(255,255,255,0.25);}
.casa-name-display{font-family:'Bebas Neue',sans-serif; font-size:28px; margin-top:10px; text-align:center; letter-spacing:0.03em;}
.swatches{display:flex; gap:8px; justify-content:center; margin-top:12px;}
.swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.swatch.selected{border-color:#fff;}

/* ---------- team grid (compact, reused) ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin:14px 0 10px;}
.tab-btn{flex:none; background:var(--panel); border:1px solid var(--border); color:var(--cream-dim); font-size:12px; font-weight:600; padding:7px 12px; border-radius:20px; cursor:pointer; white-space:nowrap;}
.tab-btn.active{background:var(--gold); color:#1a1200; border-color:var(--gold);}
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-bottom:8px;}
.team-card{background:var(--panel); border:1.5px solid var(--border); border-radius:10px; padding:8px 4px 6px; text-align:center; cursor:pointer;}
.team-card.selected{border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright);}
.team-card svg{width:42px; height:42px; display:block; margin:0 auto 4px;}
.team-card .tname{font-size:9.5px; line-height:1.2; font-weight:600;}

/* ---------- lobby / room list ---------- */
.room-code-display{text-align:center; margin:14px 0 4px;}
.room-code-display .code{font-family:'IBM Plex Mono',monospace; font-size:38px; letter-spacing:0.25em; color:var(--gold-bright); font-weight:600;}
.room-code-display .label{font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream-dim);}

.player-list{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.player-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 12px;}
.player-row svg{width:32px; height:32px; flex:none;}
.player-row .pname{font-weight:700; font-size:13.5px; flex:1;}
.player-row .ptag{font-size:9px; color:var(--gold); border:1px solid var(--border); border-radius:8px; padding:2px 6px; letter-spacing:0.08em;}
.player-row .pgoals{font-family:'IBM Plex Mono',monospace; color:var(--gold-bright); font-size:14px;}
.empty-slot{border:1.5px dashed var(--border); border-radius:10px; padding:10px 12px; text-align:center; color:var(--cream-dim); font-size:11.5px;}

.wait-msg{text-align:center; margin-top:18px; font-size:13px; color:var(--cream-dim);}
.turn-banner{text-align:center; margin:14px 0; padding:10px; background:var(--panel); border:1px solid var(--border); border-radius:12px;}
.turn-banner .who{font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--gold-bright);}
.turn-banner .round{font-size:11px; color:var(--cream-dim); letter-spacing:0.1em; text-transform:uppercase; margin-top:2px;}

/* ---------- stadium scene (reused from single-player build) ---------- */
.stadium-scene{position:relative; width:100%; aspect-ratio:800/500; border-radius:16px; overflow:hidden; box-shadow:0 20px 40px -18px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(232,184,75,0.15); margin-top:10px;}
.stadium-scene svg.bg{position:absolute; inset:0; width:100%; height:100%; display:block;}
.stadium-scene::before{content:''; position:absolute; inset:0; pointer-events:none; z-index:15; box-shadow:inset 0 0 70px 18px rgba(0,0,0,0.55);}
.crowd-sway{animation:sway 5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:translateX(0);} 50%{transform:translateX(-3px);}}
.hot-zone{position:absolute; left:50%; top:38%; width:20%; height:26%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(209,53,43,0.28) 0%, rgba(209,53,43,0) 72%); z-index:4; pointer-events:none;}
.ball-shadow{position:absolute; width:3.6%; height:1.6%; border-radius:50%; background:rgba(0,0,0,0.45); filter:blur(1.5px); z-index:5; transform:translate(-50%,-50%); transition:left .38s, top .38s, opacity .3s;}
.goal-click-area{position:absolute; left:27.5%; top:19%; width:45%; height:44%; cursor:crosshair; z-index:10;}
.aim-reticle{position:absolute; width:24px; height:24px; margin-left:-12px; margin-top:-12px; z-index:11; pointer-events:none; opacity:0; transition:opacity .15s;}
.aim-reticle.show{opacity:1;}
.aim-reticle svg{width:100%; height:100%;}
.goalkeeper{position:absolute; left:50%; top:50%; width:13%; transform:translate(-50%,-58%); z-index:6; pointer-events:none;}
.keeper-body{transition:transform .34s cubic-bezier(.22,.85,.32,1.1); transform-origin:50% 85%;}
.keeper-body svg{width:100%; display:block; filter:drop-shadow(0 6px 6px rgba(0,0,0,0.35));}
.keeper-body.dive-left-low{transform:translate(-58px,10px) rotate(-40deg);}
.keeper-body.dive-left-high{transform:translate(-50px,-34px) rotate(-30deg);}
.keeper-body.dive-right-low{transform:translate(58px,10px) rotate(40deg);}
.keeper-body.dive-right-high{transform:translate(50px,-34px) rotate(30deg);}
.keeper-body.dive-center-low{transform:translateY(14px) scale(1.03);}
.keeper-body.dive-center-high{transform:translateY(-22px) scale(1.03);}
.ball-wrap{position:absolute; left:50%; top:87%; width:4.6%; transform:translate(-50%,-50%); transition:left .38s cubic-bezier(.28,.62,.22,1), top .38s cubic-bezier(.28,.62,.22,1), width .38s; z-index:7; pointer-events:none;}
.ball-wrap svg{width:100%; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.4));}
.ball-wrap.flying{width:2.6%;}
.net-flash{position:absolute; z-index:8; pointer-events:none; opacity:0; background:radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%); border-radius:50%; transition:opacity .3s; width:18%; height:18%; transform:translate(-50%,-50%);}
.net-flash.show{opacity:1;}

.power-panel{display:none; margin-top:12px;}
.power-panel.show{display:block;}
.power-track{position:relative; height:24px; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
.power-fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg, var(--success), var(--gold) 55%, var(--danger) 92%);}
.power-labels{display:flex; justify-content:space-between; font-size:9px; color:var(--cream-dim); margin-top:4px; letter-spacing:0.1em; text-transform:uppercase;}
.power-actions{display:flex; gap:8px; margin-top:10px;}
.power-actions .shoot-btn{flex:2; height:50px; border:none; border-radius:12px; background:linear-gradient(180deg,var(--danger) 0%, #8f2018 100%); color:#fff; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.1em; cursor:pointer; box-shadow:0 6px 0 #5e140f;}
.power-actions .shoot-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #5e140f;}
.power-actions .cancel-btn{flex:1; height:50px; border:1px solid var(--border); border-radius:12px; background:var(--panel); color:var(--cream-dim); font-size:12px; cursor:pointer;}

.hint{text-align:center; font-size:11.5px; color:var(--cream-dim); margin-top:8px; min-height:16px;}
.message-banner{text-align:center; font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:0.05em; min-height:28px; margin-top:6px; opacity:0; transition:opacity .25s; color:var(--gold-bright);}
.message-banner.show{opacity:1;}
.message-banner.goal{color:var(--success);}
.message-banner.miss{color:var(--danger);}

/* ---------- scoreboard ---------- */
.scoreboard{margin-top:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:6px 4px;}
.score-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;}
.score-row.active-turn{background:rgba(232,184,75,0.1);}
.score-row svg{width:28px; height:28px; flex:none;}
.score-row .sname{flex:1; font-weight:700; font-size:12.5px;}
.score-row .sdots{display:flex; gap:3px;}
.score-row .dot{width:9px; height:9px; border-radius:50%; background:var(--panel-3); border:1px solid var(--border);}
.score-row .dot.goal{background:var(--success); border-color:var(--success);}
.score-row .dot.miss{background:var(--danger); border-color:var(--danger);}
.score-row .stotal{font-family:'IBM Plex Mono',monospace; color:var(--gold-bright); font-size:14px; width:26px; text-align:right;}

/* ---------- results ---------- */
.winner-card{text-align:center; background:linear-gradient(180deg, rgba(232,184,75,0.14), transparent); border:1px solid var(--gold-bright); border-radius:16px; padding:22px 14px; margin-top:12px;}
.winner-card .trophy{font-size:40px;}
.winner-card svg{width:64px; height:64px; margin:6px auto;}
.winner-card .wname{font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--gold-bright);}
.winner-card .wscore{font-size:12px; color:var(--cream-dim); margin-top:2px;}

.footnote{text-align:center; font-size:10px; color:var(--cream-dim); margin-top:18px; line-height:1.6;}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--panel-2); border:1px solid var(--gold-bright); color:var(--gold-bright); padding:10px 18px; border-radius:10px; font-size:12.5px; font-weight:600; opacity:0; transition:opacity .25s, transform .25s; z-index:100; pointer-events:none; white-space:nowrap; max-width:90vw; text-align:center;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.coin-particle{position:fixed; font-size:18px; pointer-events:none; z-index:90; animation:coin-fall linear forwards;}
@keyframes coin-fall{0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(540deg); opacity:0;}}
.back-link{background:none; border:none; color:var(--cream-dim); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:14px; display:block; margin-left:auto; margin-right:auto;}

@media (prefers-reduced-motion: reduce){ .keeper-body,.ball-wrap{transition:none !important;} .coin-particle{display:none;} }
</style>
</head>
<body>
<div class="app">

  <div class="eyebrow">Estádio Nacional — Multiplayer</div>
  <h1 style="text-align:center; font-size:36px; margin:0;">Pênalti <span style="color:var(--gold-bright)">Decisivo</span></h1>
  <div class="subtitle">Até 4 jogadores, cada um no seu celular, disputando 5 rodadas</div>
  <div class="demo-badge">● Simulação — capital demo fictício, não convertível em dinheiro real</div>

  <!-- SCREEN: HOME -->
  <section class="screen active" id="screen-home">
    <div class="home-card">
      <div class="field-label" style="margin-top:0;">Entrar com código da sala</div>
      <input class="text-input code-input" id="joinCodeInput" maxlength="4" placeholder="0000" inputmode="numeric">
      <button class="big-btn primary" id="joinCodeBtn">Buscar sala</button>
      <div class="divider">ou</div>
      <button class="big-btn accent" id="createRoomBtn">Criar nova sala</button>
    </div>
  </section>

  <!-- SCREEN: SPLASH (host only) -->
  <section class="screen" id="screen-splash">
    <div class="home-card">
      <div class="field-label" style="margin-top:0;">Nome da casa de apostas</div>
      <input class="text-input" id="casaNameInput" placeholder="Ex: Bet Estrela" maxlength="24" value="Bet Estrela">
      <div class="casa-badge-wrap">
        <div class="casa-emblem" id="casaEmblemPreview"></div>
        <div class="casa-name-display" id="casaNameDisplayPreview"></div>
        <div class="swatches" id="swatches"></div>
      </div>
      <button class="big-btn primary" id="splashContinueBtn">Continuar</button>
    </div>
  </section>

  <!-- SCREEN: SETUP (name + team, host or joiner) -->
  <section class="screen" id="screen-setup">
    <div class="home-card">
      <div class="casa-badge-wrap" id="setupCasaBadge" style="margin-top:0;"></div>
      <div class="field-label">Seu nome</div>
      <input class="text-input" id="playerNameInput" placeholder="Digite seu nome" maxlength="16">
      <div class="field-label">Escolha sua camisa</div>
      <div class="tabs" id="tabs"></div>
      <div class="team-grid" id="teamGrid"></div>
      <button class="big-btn primary" id="setupConfirmBtn" disabled>Continuar</button>
      <button class="back-link" id="setupBackBtn">← Voltar</button>
    </div>
  </section>

  <!-- SCREEN: ROOM (adaptive: lobby / active turn / spectate / results) -->
  <section class="screen" id="screen-room">
    <div id="roomContent"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Team data ---------------- */
  const SHIRT_PATH = "M22 4 L8 14 L14 24 L20 19 L20 54 Q20 57 23 57 L37 57 Q40 57 40 54 L40 19 L46 24 L52 14 L38 4 Q34 8 30 8 Q26 8 22 4 Z";

  // Humanoid goalkeeper: shadow, back leg, back arm, torso, collar, front leg,
  // front arm, head, hair — layered so limbs read as a body, not boxes.
  const KEEPER_SVG =
    '<svg viewBox="0 0 50 90">'+
      '<ellipse cx="25" cy="86" rx="15" ry="3" fill="#000" opacity="0.22"/>'+
      '<path d="M20 56 Q13 70 11 84" stroke="#14161f" stroke-width="9" stroke-linecap="round" fill="none"/>'+
      '<ellipse cx="10" cy="85" rx="6.5" ry="4" fill="#0a0a0a"/>'+
      '<path d="M17 30 Q5 26 4 12" stroke="#f0dcc0" stroke-width="8" stroke-linecap="round" fill="none"/>'+
      '<circle cx="4" cy="10" r="6" fill="#ff8a00"/>'+
      '<path d="M13 22 Q11 42 15 56 L33 56 Q37 42 35 22 Q24 15 13 22 Z" fill="#d9e02b"/>'+
      '<path d="M17 23 Q24 28 31 23" stroke="#191b24" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
      '<path d="M30 56 Q37 70 39 84" stroke="#14161f" stroke-width="9" stroke-linecap="round" fill="none"/>'+
      '<ellipse cx="40" cy="85" rx="6.5" ry="4" fill="#0a0a0a"/>'+
      '<path d="M33 28 Q45 24 46 10" stroke="#f0dcc0" stroke-width="8" stroke-linecap="round" fill="none"/>'+
      '<circle cx="46" cy="9" r="6" fill="#ff8a00"/>'+
      '<circle cx="24" cy="12" r="8.5" fill="#e8b98a"/>'+
      '<path d="M16 9 Q24 1 32 9 Q31 4 24 3 Q17 4 16 9 Z" fill="#2a1c12"/>'+
    '</svg>';

  const BALL_SVG =
    '<svg viewBox="0 0 40 40">'+
      '<circle cx="20" cy="20" r="18" fill="#f5f5f5" stroke="#c8c8c8" stroke-width="1"/>'+
      '<polygon points="20,8 27,13 24,21 16,21 13,13" fill="#141414"/>'+
      '<polygon points="6,17 12,14 12,23 7,26" fill="#141414" opacity="0.9"/>'+
      '<polygon points="34,17 28,14 28,23 33,26" fill="#141414" opacity="0.9"/>'+
    '</svg>';
  const TEAMS = [
    {id:'cor',  name:'Corinthians',           cat:'brasileiro',    colors:['#ffffff','#0a0a0a'], pattern:'solid'},
    {id:'pal',  name:'Palmeiras',             cat:'brasileiro',    colors:['#0e6b3a','#ffffff'], pattern:'solid'},
    {id:'sao',  name:'São Paulo',             cat:'brasileiro',    colors:['#ffffff','#c8102e'], pattern:'sash'},
    {id:'san',  name:'Santos',                cat:'brasileiro',    colors:['#ffffff','#0a0a0a'], pattern:'sash'},
    {id:'flu',  name:'Fluminense',            cat:'brasileiro',    colors:['#7a1f3d','#0e6b3a'], pattern:'stripes'},
    {id:'fla',  name:'Flamengo',              cat:'brasileiro',    colors:['#c8102e','#0a0a0a'], pattern:'stripes'},
    {id:'vas',  name:'Vasco da Gama',         cat:'brasileiro',    colors:['#ffffff','#0a0a0a'], pattern:'sash'},
    {id:'sel',  name:'Seleção Brasileira',    cat:'brasileiro',    colors:['#f7d117','#0e6b3a'], pattern:'solid'},
    {id:'rma',  name:'Real Madrid',           cat:'internacional', colors:['#ffffff','#7a1f3d'], pattern:'solid'},
    {id:'bar',  name:'Barcelona',             cat:'internacional', colors:['#a50044','#004d98'], pattern:'stripes'},
    {id:'mci',  name:'Manchester City',       cat:'internacional', colors:['#6cabdd','#1c2c5b'], pattern:'solid'},
    {id:'psg',  name:'Paris Saint-Germain',   cat:'internacional', colors:['#001e50','#da291c'], pattern:'sash'},
    {id:'juv',  name:'Juventus',              cat:'internacional', colors:['#111111','#ffffff'], pattern:'stripes'},
    {id:'bay',  name:'Bayern de Munique',     cat:'internacional', colors:['#dc052d','#0066b2'], pattern:'solid'},
    {id:'arg',  name:'Seleção Argentina',     cat:'selecao',       colors:['#75aadb','#ffffff'], pattern:'stripes'},
    {id:'fra',  name:'Seleção Francesa',      cat:'selecao',       colors:['#002654','#ffffff'], pattern:'solid'},
    {id:'ale',  name:'Seleção Alemã',         cat:'selecao',       colors:['#ffffff','#111111'], pattern:'solid'},
    {id:'esp',  name:'Seleção Espanhola',     cat:'selecao',       colors:['#c60b1e','#ffc400'], pattern:'solid'},
    {id:'por',  name:'Seleção Portuguesa',    cat:'selecao',       colors:['#c8102e','#046a38'], pattern:'sash'},
    {id:'ita',  name:'Seleção Italiana',      cat:'selecao',       colors:['#0a2f6e','#ffffff'], pattern:'solid'},
    {id:'self', name:'Seleção Brasileira Fem.', cat:'feminino',    colors:['#f7d117','#0e6b3a'], pattern:'solid'},
    {id:'corf', name:'Corinthians Feminino',  cat:'feminino',      colors:['#ffffff','#0a0a0a'], pattern:'solid'},
    {id:'palf', name:'Palmeiras Feminino',    cat:'feminino',      colors:['#0e6b3a','#ffffff'], pattern:'solid'},
    {id:'barf', name:'Barcelona Femení',      cat:'feminino',      colors:['#a50044','#004d98'], pattern:'stripes'},
    {id:'flaf', name:'Flamengo Feminino',     cat:'feminino',      colors:['#c8102e','#0a0a0a'], pattern:'stripes'},
  ];
  const CATS = [
    {id:'brasileiro', label:'Brasileiros'},
    {id:'internacional', label:'Internacionais'},
    {id:'selecao', label:'Seleções'},
    {id:'feminino', label:'Feminino'},
  ];
  function teamById(id){ return TEAMS.find(t=>t.id===id); }
  function jerseySVG(team){
    const [c1,c2] = team.colors;
    let defs='', bodyFill='fill="'+c1+'"', overlay='';

  /* ---------------- Storage helpers (built-in server API) ---------------- */
  // Talks to the tiny Express backend deployed alongside this page (see server.js).

  const storageAvailable = true;

  async function storeGet(key){
    try{
      const res = await fetch('/kv/' + encodeURIComponent(key), { cache:'no-store' });
      if(!res.ok) return null;
      const data = await res.json();
      return data || null;
    }catch(e){ console.error('storage get failed', key, e); return null; }
  }
  async function storeSet(key, obj){
    try{
      const res = await fetch('/kv/' + encodeURIComponent(key), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return true;
    }catch(e){ console.error('storage set failed', key, e); showToast('Erro ao conectar no servidor. Se o site ficou muitos minutos sem uso, ele pode estar "acordando" — tente de novo em alguns segundos.'); return false; }
  }

  /* ---------------- Audio (synthesized) ---------------- */
  let audioCtx = null;
  function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function tone(freq,duration,type,gainVal,delay){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(gainVal||0.2,t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration);
  }
  function noise(duration,gainVal,filterFreq,qVal){
    if(!audioCtx) return;
    const size = Math.floor(audioCtx.sampleRate*duration);
    const buffer = audioCtx.createBuffer(1,size,audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++){ data[i] = (Math.random()*2-1) * (1 - i/size); }
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const filt = audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value = filterFreq||1000; filt.Q.value = qVal||1;
    const gain = audioCtx.createGain(); gain.gain.value = gainVal||0.15;
    src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  }

  async function confirmJoin(){
    const fresh = await storeGet('room:'+roomCode);
    if(!fresh || fresh.status!=='lobby' || fresh.players.length>=4){
      showToast('Não foi possível entrar — sala cheia ou já iniciada'); showScreen('home'); return;
    }
    if(!fresh.players.some(p=>p.id===myId)){
      fresh.players.push({id:myId, name:myName, teamId:myTeam.id, goals:0, attempts:0});

    fresh.updatedAt = Date.now();

        }

        '<div class="goal-click-area" id="goalClickArea"></div>'+
        '<div class="aim-reticle" id="aimReticle"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#ffd876" stroke-width="2"/><line x1="13" y1="0" x2="13" y2="7" stroke="#ffd876" stroke-width="2"/><line x1="13" y1="19" x2="13" y2="26" stroke="#ffd876" stroke-width="2"/><line x1="0" y1="13" x2="7" y2="13" stroke="#ffd876" stroke-width="2"/><line x1="19" y1="13" x2="26" y2="13" stroke="#ffd876" stroke-width="2"/></svg></div>'+
        '<div class="net-flash" id="netFlash"></div>'+
        '<div class="goalkeeper" id="goalkeeper"><div class="keeper-body" id="keeperBody">'+KEEPER_SVG+'</div></div>'+
        '<div class="ball-wrap" id="ballWrap">'+BALL_SVG+'</div>'+
      '</div>';
  }

  /* ---------------- Active shooter UI (stadium scene) ---------------- */
  function renderActiveTurn(){
    roomContent.innerHTML =
      '<div class="turn-banner"><div class="who">Sua vez de chutar!</div><div class="round">Rodada '+room.round+' de 5</div></div>'+
      stadiumSceneHTML()+
      '<div class="hint" id="hint">Toque na área do gol para mirar o chute.</div>'+
      '<div class="power-panel" id="powerPanel">'+
        '<div class="power-track"><div class="power-fill" id="powerFill"></div></div>'+
        '<div class="power-labels"><span>Fraco</span><span>Ideal</span><span>Forte demais</span></div>'+
        '<div class="power-actions"><button class="cancel-btn" id="cancelAimBtn">Cancelar mira</button><button class="shoot-btn" id="shootBtn">Chutar!</button></div>'+
      '</div>'+
      '<div class="message-banner" id="messageBanner"></div>'+
      scoreboardHTML();

    bindActiveTurnEvents();
  }

  const GOAL = {xMin:250, xMax:550, yMin:120, yMax:300};
  const CLICK_VB = {x:220, y:96, w:360, h:220};
  let aiming = false, aimVB = null, powerLoop = null, powerStart = 0;

  function bindActiveTurnEvents(){
    const goalClickArea = document.getElementById('goalClickArea');
    const aimReticle = document.getElementById('aimReticle');
    const powerPanel = document.getElementById('powerPanel');
    const powerFill = document.getElementById('powerFill');
    const shootBtn = document.getElementById('shootBtn');
    const cancelAimBtn = document.getElementById('cancelAimBtn');
    const hint = document.getElementById('hint');
    const scene = document.getElementById('scene');

    aiming = false; aimVB = null;

    goalClickArea.addEventListener('click', (e)=>{
      if(shotInProgress) return;
      const rect = goalClickArea.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      const vbX = CLICK_VB.x + px*CLICK_VB.w;
      const vbY = CLICK_VB.y + py*CLICK_VB.h;
      aimVB = {x:vbX, y:vbY};
      aiming = true;

      const sceneRect = scene.getBoundingClientRect();
      const leftPct = ((rect.left - sceneRect.left) + e.clientX - rect.left) / sceneRect.width * 100;
      const topPct = ((rect.top - sceneRect.top) + e.clientY - rect.top) / sceneRect.height * 100;
      aimReticle.style.left = leftPct + '%';
      aimReticle.style.top = topPct + '%';
      aimReticle.classList.add('show');

      hint.textContent = 'Mira definida. Ajuste a força e chute!';
      powerPanel.classList.add('show');
      startPowerLoop(powerFill);
    });

    cancelAimBtn.addEventListener('click', ()=>{
      aiming = false; aimVB = null;
      aimReticle.classList.remove('show');
      powerPanel.classList.remove('show');
      hint.textContent = 'Toque na área do gol para mirar o chute.';
      if(powerLoop){ cancelAnimationFrame(powerLoop); powerLoop = null; }
    });

    shootBtn.addEventListener('click', ()=>{
      if(!aiming || shotInProgress) return;
      const power = parseFloat(powerFill.style.width) || 50;
      if(powerLoop){ cancelAnimationFrame(powerLoop); powerLoop = null; }
      takeShot(aimVB, power);
    });
  }

  function startPowerLoop(powerFill){
    powerStart = performance.now();
    const period = 950;
    function loop(now){
      const t = (now - powerStart) % period;
      const x = t / period;
      const val = x < 0.5 ? x*2*100 : (1-x)*2*100;
      powerFill.style.width = val + '%';
      powerLoop = requestAnimationFrame(loop);
    }
    powerLoop = requestAnimationFrame(loop);
  }

  function zoneOf(vbX, vbY){
    const xZone = vbX < 320 ? 'left' : (vbX > 480 ? 'right' : 'center');
    const yZone = vbY < 210 ? 'high' : 'low';
    return xZone+'-'+yZone;
  }
  function baseSaveChance(zone){
    // Goleiro em modo Difícil fixo: defesa alta quando lê a direção certa.
    const base = (zone==='center-low' || zone==='center-high') ? 0.88 : 0.62;
    return Math.min(0.92, base);
  }

  function takeShot(vb, power){
    shotInProgress = true;
    ensureAudio(); sfxKick();
    const hint = document.getElementById('hint');
    const aimReticle = document.getElementById('aimReticle');
    const powerPanel = document.getElementById('powerPanel');
    const ballWrap = document.getElementById('ballWrap');
    const ballShadow = document.getElementById('ballShadow');
    const keeperBody = document.getElementById('keeperBody');

    powerPanel.classList.remove('show');
    aimReticle.classList.remove('show');
    hint.textContent = '';

    const onTarget = vb.x >= GOAL.xMin && vb.x <= GOAL.xMax && vb.y >= GOAL.yMin && vb.y <= GOAL.yMax;
    const blastedWide = (power < 12 || power > 92) && Math.random() < 0.3;

    ballWrap.style.left = (vb.x/800*100) + '%';
    ballWrap.style.top = (vb.y/500*100) + '%';
    ballWrap.classList.add('flying');
    ballShadow.style.left = (vb.x/800*100) + '%';
    ballShadow.style.top = ((vb.y+150)/500*100) + '%';
    ballShadow.style.opacity = '0.15';

    let result, chosenZone = null, shotZone = null;
    if(!onTarget || blastedWide){
      result = 'wide';
    } else {
      shotZone = zoneOf(vb.x, vb.y);
      const readRate = 0.82; // modo Difícil fixo
      const guessCorrect = Math.random() < readRate;
      const zones = ['left-high','left-low','center-high','center-low','right-high','right-low'];
      chosenZone = guessCorrect ? shotZone : zones.filter(z=>z!==shotZone)[Math.floor(Math.random()*5)];
      if(chosenZone === shotZone){
        result = Math.random() < baseSaveChance(shotZone) ? 'save' : 'goal';
      } else {
        result = 'goal';
      }
      keeperBody.className = 'keeper-body dive-' + chosenZone;
    }

    setTimeout(()=>{ resolveOutcome(result, shotZone, vb, chosenZone); }, 440);
  }

  async function resolveOutcome(result, shotZone, vb, chosenZone){
    const banner = document.getElementById('messageBanner');
    const netFlash = document.getElementById('netFlash');
    banner.classList.remove('goal','miss');
    let goalScored = false;

    if(result === 'goal'){
      goalScored = true;
      const isCorner = shotZone === 'left-high' || shotZone === 'right-high';
      banner.textContent = isCorner ? 'GOOOL no ângulo!' : 'GOOOL!';
      banner.classList.add('goal');
      netFlash.classList.add('show');
      sfxNet(); setTimeout(sfxCheer, 120);
      spawnCoins(12);
    } else if(result === 'save'){
      banner.textContent = 'Defesa do goleiro!';
      banner.classList.add('miss');
      sfxSigh();
    } else {
      banner.textContent = 'Para fora!';
      banner.classList.add('miss');
      sfxSigh();
    }
    banner.classList.add('show');

    setTimeout(async ()=>{
      await advanceTurn(goalScored, { x:vb.x, y:vb.y, chosenZone, shotZone, result });
    }, 1200);
  }

  async function advanceTurn(goalScored, shotInfo){
    const fresh = await storeGet('room:'+roomCode) || room;
    const idx = fresh.players.findIndex(p=>p.id===myId);
    if(idx >= 0){
      fresh.players[idx].attempts += 1;
      if(goalScored) fresh.players[idx].goals += 1;
    }
    fresh.lastShot = {
      by: myId,
      byName: myName,
      teamId: myTeam.id,
      x: shotInfo.x, y: shotInfo.y,
      chosenZone: shotInfo.chosenZone,
      shotZone: shotInfo.shotZone,
      result: shotInfo.result,
      ts: Date.now(),
    };
    lastShownShotTs = fresh.lastShot.ts; // don't replay my own shot back to myself
    fresh.turnIndex += 1;
    if(fresh.turnIndex >= fresh.players.length){ fresh.turnIndex = 0; fresh.round += 1; }
    if(fresh.round > 5){ fresh.status = 'finished'; }
    fresh.updatedAt = Date.now();
    await storeSet('room:'+roomCode, fresh);
    room = fresh;
    shotInProgress = false;
    renderRoomScreen();
  }

  /* ---------------- Results ---------------- */
  function renderResults(){
    const sorted = [...room.players].sort((a,b)=>b.goals-a.goals);
    const top = sorted[0];
    const tied = sorted.filter(p=>p.goals===top.goals);
    let html = '<div class="winner-card">';
    html += '<div class="trophy">🏆</div>';
    html += jerseySVG(teamById(top.teamId));
    if(tied.length>1){
      html += '<div class="wname">Empate!</div><div class="wscore">'+tied.map(p=>p.name).join(' & ')+' — '+top.goals+'/5 gols</div>';
    } else {
      html += '<div class="wname">'+top.name+'</div><div class="wscore">Campeão da disputa — '+top.goals+'/5 gols</div>';
    }
    html += '</div>';
    html += scoreboardHTML();
    if(isHost){
      html += '<button class="big-btn accent" id="playAgainBtn">Jogar novamente</button>';
    } else {
      html += '<div class="wait-msg">Aguardando o anfitrião iniciar uma nova disputa...</div>';
    }
    roomContent.innerHTML = html;
    if(isHost){
      document.getElementById('playAgainBtn').addEventListener('click', playAgain);
    }
  }

  async function playAgain(){
    const fresh = await storeGet('room:'+roomCode) || room;
    fresh.players.forEach(p=>{ p.goals = 0; p.attempts = 0; });
    fresh.status = 'lobby'; fresh.round = 1; fresh.turnIndex = 0; fresh.lastShot = null; fresh.updatedAt = Date.now();
    await storeSet('room:'+roomCode, fresh);
    room = fresh;
    lastRenderedTurnKey = null;
    lastShownShotTs = null;
    renderRoomScreen();
  }

})();
</script>
</body>
</html>
