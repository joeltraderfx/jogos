<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sala Interativa - Tradução Simultânea</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --panel: #12131a; --panel-2: #191b24; --panel-3: #20222e;
  --gold: #e8b84b; --gold-bright: #ffd876;
  --success: #2fa98c; --danger: #d1352b;
  --cream: #f4ede1; --cream-dim: #9a958d;
  --border: rgba(232,184,75,0.22);
}

* { box-sizing: border-box; touch-action: manipulation; }
body {
  margin: 0; padding: 10px;
  background: radial-gradient(ellipse 90% 60% at 50% -10%, #1c2b3f 0%, #0a0b10 55%);
  min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--cream);
  display: flex; justify-content: center;
}

.app { width: 100%; max-width: 950px; }
h1, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; text-align: center; margin: 0 0 10px; }

.screen { display: none; }
.screen.active { display: block; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }

.text-input { width: 100%; background: #08090d; border: 1.5px solid var(--border); color: var(--cream); font-size: 15px; padding: 12px; border-radius: 8px; }
.code-input { text-align: center; font-family: monospace; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.big-btn {
  flex: 1; min-width: 130px; height: 44px; border: none; border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 16px; cursor: pointer; transition: 0.15s; color: #fff;
}
.big-btn.primary { background: linear-gradient(180deg, var(--success) 0%, #1f7d68 100%); }
.big-btn.accent { background: linear-gradient(180deg, var(--gold) 0%, #a9781f 100%); color: #1a1200; }
.big-btn.meeting { background: linear-gradient(180deg, #3f7fd1 0%, #1c4b82 100%); }

/* VIDEOS & LEGENDAS */
.video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top:10px; }
.video-card { position: relative; background: #000; border-radius: 8px; border: 1px solid var(--border); aspect-ratio: 4/3; overflow: hidden; }
.video-card video { width: 100%; height: 100%; object-fit: cover; }
.video-card .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: var(--gold-bright); font-weight: bold; z-index: 2; }
.subtitles { position: absolute; bottom: 10px; left: 5%; width: 90%; text-align: center; background: rgba(0,0,0,0.7); color: #fff; font-size: 14px; padding: 6px; border-radius: 6px; z-index: 3; display: none; }
.subtitles.active { display: block; }
.sub-translated { color: var(--gold-bright); font-weight: bold; margin-top: 4px; font-size: 15px; }

/* TRADUÇÃO BAR */
.translation-bar { background: var(--panel-2); padding: 10px; border-radius: 8px; border: 1px solid #3f7fd1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-size: 13px; }
select { background: #000; color: #fff; border: 1px solid var(--border); padding: 6px; border-radius: 4px; }

@media (max-width: 600px) {
  .video-grid { grid-template-columns: 1fr; }
  .big-btn { font-size: 14px; height: 40px; }
}
</style>
</head>
<body>

<div class="app">
  <h1>SALA <span style="color:var(--gold-bright)">INTERATIVA</span></h1>

  <!-- INÍCIO -->
  <section class="screen active" id="screen-home">
    <div class="card">
      <label style="font-size: 12px; color: var(--cream-dim);">SEU NOME</label>
      <input class="text-input" id="userNameInput" placeholder="Ex: Joel..." maxlength="16">
      
      <div style="margin-top: 10px;">
        <label style="font-size: 12px; color: var(--cream-dim);">CÓDIGO DA SALA (4 DIGITOS)</label>
        <input class="text-input code-input" id="roomCodeInput" maxlength="4" placeholder="5747">
      </div>
      
      <div class="btn-group">
        <button class="big-btn primary" id="btnJoin">Entrar na Sala</button>
        <button class="big-btn accent" id="btnCreate">Criar Sala</button>
      </div>
    </div>
  </section>

  <!-- SALA -->
  <section class="screen" id="screen-room">
    <div class="card" style="text-align:center;">
      <div style="font-size:11px; color:var(--cream-dim);">CÓDIGO DA SALA</div>
      <h2 id="lblRoomCode" style="font-size:32px; color:var(--gold-bright); margin:0;">----</h2>
      
      <div class="btn-group" style="justify-content: center;">
        <button class="big-btn meeting" id="btnStartMedia">📸 ATIVAR MINHA CÂMERA E ÁUDIO</button>
      </div>
    </div>

    <!-- PAINEL DE TRADUÇÃO (DEEPL SIMULADO) -->
    <div class="translation-bar">
      <strong>🌐 Tradução Simultânea:</strong>
      <label>Meu Idioma:</label>
      <select id="myLang">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en-US">Inglês (EUA)</option>
        <option value="es-ES">Espanhol</option>
      </select>
      
      <label>Traduzir para:</label>
      <select id="targetLang">
        <option value="en">Inglês (DEEPL Demo)</option>
        <option value="pt">Português (DEEPL Demo)</option>
        <option value="es">Espanhol (DEEPL Demo)</option>
      </select>
      
      <button id="btnStartTranslate" style="background:var(--success); color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Ativar Legendas</button>
    </div>

    <!-- ÁREA DE VÍDEOS -->
    <div id="meetingArea" class="card" style="margin-top:12px;">
      <h3 style="margin:0 0 8px; font-size:14px; text-align:left; color:var(--cream-dim);">VÍDEOS DA REUNIÃO</h3>
      <div class="video-grid" id="videoGrid"></div>
    </div>
  </section>
</div>

<script>
(function(){
  let peer = null;
  let localStream = null;
  let myName = '';
  let roomCode = '';
  let myPeerId = '';
  const activeConns = [];
  const remoteNames = {}; // Armazena os nomes conectados

  const userNameInput = document.getElementById('userNameInput');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const videoGrid = document.getElementById('videoGrid');
  
  // SISTEMA DE RECONHECIMENTO DE VOZ
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isTranslating = false;

  document.getElementById('btnCreate').addEventListener('click', () => {
    startRoom(Math.floor(1000 + Math.random() * 9000).toString());
  });

  document.getElementById('btnJoin').addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if(code.length !== 4) return alert('Digite um código de 4 dígitos!');
    startRoom(code);
  });

  function startRoom(code) {
    myName = userNameInput.value.trim() || 'Usuário';
    roomCode = code;
    myPeerId = 'room' + roomCode + '-' + myName.toLowerCase().replace(/[^a-z0-9]/g, '');

    peer = new Peer(myPeerId);

    peer.on('open', () => {
      document.getElementById('lblRoomCode').textContent = roomCode;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-room').classList.add('active');
    });

    // Receber chamadas de vídeo
    peer.on('call', (call) => {
      call.answer(localStream);
      call.on('stream', (remoteStream) => {
        addVideoFeed(call.peer, remoteNames[call.peer] || 'Conectando...', remoteStream);
      });
    });

    // Conexão de dados para nomes e legendas
    peer.on('connection', setupConnection);
  }

  // ATIVAÇÃO MANUAL DA CÂMERA (EVITA BLOQUEIO DE CELULAR)
  document.getElementById('btnStartMedia').addEventListener('click', async () => {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      addVideoFeed(myPeerId, myName + ' (Você)', localStream, true);
      document.getElementById('btnStartMedia').style.display = 'none';
      connectToPeers();
    } catch(e) {
      alert('Erro: Verifique as permissões de câmera do seu navegador.');
    }
  });

  function setupConnection(conn) {
    if(!activeConns.includes(conn)) activeConns.push(conn);

    conn.on('data', (data) => {
      if(data.type === 'identity') {
        remoteNames[data.peerId] = data.name;
        updateVideoTag(data.peerId, data.name);
      }
      if(data.type === 'subtitle') {
        showSubtitle(data.peerId, data.original, data.translated);
      }
    });

    conn.on('open', () => {
      // Envia meu nome para quem se conectou
      conn.send({ type: 'identity', peerId: myPeerId, name: myName });
    });
  }

  function connectToPeers() {
    // Lista genérica de peers base para procurar na sala
    const possiblePeers = ['joel', 'cliente', 'admin', 'user1', 'user2'];
    possiblePeers.forEach(target => {
      const targetPeerId = 'room' + roomCode + '-' + target;
      if(targetPeerId !== myPeerId) {
        const conn = peer.connect(targetPeerId);
        if(conn) setupConnection(conn);
        if(localStream) {
          const call = peer.call(targetPeerId, localStream);
          if(call) {
            call.on('stream', (remoteStream) => {
              addVideoFeed(targetPeerId, remoteNames[targetPeerId] || target, remoteStream);
            });
          }
        }
      }
    });
  }

  function addVideoFeed(id, label, stream, isMuted = false) {
    if(document.getElementById('vcard-' + id)) return;

    const card = document.createElement('div');
    card.className = 'video-card';
    card.id = 'vcard-' + id;

    const video = document.createElement('video');
    video.autoplay = true; video.playsInline = true; video.muted = isMuted;
    video.srcObject = stream;

    const tag = document.createElement('div');
    tag.className = 'tag'; tag.id = 'tag-' + id; tag.textContent = label;

    const subs = document.createElement('div');
    subs.className = 'subtitles'; subs.id = 'subs-' + id;

    card.appendChild(video); card.appendChild(tag); card.appendChild(subs);
    videoGrid.appendChild(card);
  }

  function updateVideoTag(id, name) {
    const tag = document.getElementById('tag-' + id);
    if(tag) tag.textContent = name;
  }

  // LÓGICA DE TRADUÇÃO SIMULTÂNEA
  document.getElementById('btnStartTranslate').addEventListener('click', () => {
    if(!SpeechRecognition) return alert('Seu navegador não suporta reconhecimento de voz. Use o Google Chrome.');
    
    if(isTranslating) {
      if(recognition) recognition.stop();
      isTranslating = false;
      document.getElementById('btnStartTranslate').textContent = "Ativar Legendas";
      document.getElementById('btnStartTranslate').style.background = "var(--success)";
      return;
    }

    isTranslating = true;
    document.getElementById('btnStartTranslate').textContent = "Parar Legendas";
    document.getElementById('btnStartTranslate').style.background = "var(--danger)";

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = document.getElementById('myLang').value;

    recognition.onresult = async (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript;
      const targetLang = document.getElementById('targetLang').value;
      
      // Simulação de chamada API DEEPL (Usando MyMemory Pública para Demo Front-End)
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${recognition.lang.split('-')[0]}|${targetLang}`);
        const data = await res.json();
        const translatedText = data.responseData.translatedText;

        // Mostra pra mim mesmo
        showSubtitle(myPeerId, transcript, translatedText);

        // Envia pros clientes
        activeConns.forEach(conn => {
          if(conn.open) {
            conn.send({ type: 'subtitle', peerId: myPeerId, original: transcript, translated: translatedText });
          }
        });
      } catch(e) {
        console.log("Erro na tradução", e);
      }
    };

    recognition.onend = () => { if(isTranslating) recognition.start(); };
    recognition.start();
  });

  let subtitleTimers = {};
  function showSubtitle(peerId, original, translated) {
    const subEl = document.getElementById('subs-' + peerId);
    if(!subEl) return;

    subEl.innerHTML = `<div>${original}</div><div class="sub-translated">${translated}</div>`;
    subEl.classList.add('active');

    clearTimeout(subtitleTimers[peerId]);
    subtitleTimers[peerId] = setTimeout(() => { subEl.classList.remove('active'); }, 5000);
  }

})();
</script>
</body>
</html>
