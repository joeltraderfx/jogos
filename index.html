<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sala de reunião multilingue</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap');

:root {
  --panel: #12131a; --panel-2: #191b24; --panel-3: #20222e;
  --gold: #e8b84b; --gold-bright: #ffd876;
  --success: #2fa98c; --danger: #d1352b; --info: #3f7fd1;
  --cream: #f4ede1; --cream-dim: #9a958d;
  --border: rgba(232,184,75,0.22);
}

* { box-sizing: border-box; touch-action: manipulation; }
body {
  margin: 0; padding: 10px;
  background: radial-gradient(ellipse 90% 60% at 50% -10%, #1c2b3f 0%, #0a0b10 55%);
  min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--cream);
  display: flex; justify-content: center;
}

.app { width: 100%; max-width: 1000px; }
h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; text-align: center; margin: 0 0 10px; }

.screen { display: none; }
.screen.active { display: block; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }

.text-input { width: 100%; background: #08090d; border: 1.5px solid var(--border); color: var(--cream); font-size: 16px; padding: 12px; border-radius: 8px; }
.code-input { text-align: center; font-family: monospace; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.big-btn {
  flex: 1; min-width: 130px; height: 48px; border: none; border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; cursor: pointer; color: #fff;
}
.big-btn.primary { background: linear-gradient(180deg, var(--success) 0%, #1f7d68 100%); }
.big-btn.accent { background: linear-gradient(180deg, var(--gold) 0%, #a9781f 100%); color: #1a1200; }
.big-btn.meeting { background: linear-gradient(180deg, #3f7fd1 0%, #1c4b82 100%); }

/* ---------- top bar ---------- */
.top-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.room-code-pill{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:6px 14px; }
.room-code-pill .code{ font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--gold-bright); letter-spacing:0.1em; }
.participant-count{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; }
.participant-count b{ color:var(--gold-bright); }
.leave-btn{ margin-left:auto; background:var(--danger); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; }

/* ---------- toolbar ---------- */
.toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.tool-btn{ background:var(--panel-2); border:1px solid var(--border); color:var(--cream); border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600; }
.tool-btn.active{ background:var(--gold); color:#1a1200; border-color:var(--gold); }
.tool-btn.danger-state{ background:var(--danger); color:#fff; border-color:var(--danger); }
.tool-btn .badge-dot{ width:8px; height:8px; border-radius:50%; background:var(--danger); display:none; }
.tool-btn .badge-dot.show{ display:inline-block; }

/* ---------- video grid ---------- */
.video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top:10px; }
.video-card { position: relative; background: #000; border-radius: 10px; border: 1.5px solid var(--border); aspect-ratio: 4/3; overflow: hidden; }
.video-card video { width: 100%; height: 100%; object-fit: cover; }
.video-card .tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--gold-bright); font-weight: bold; z-index: 2; border: 1px solid var(--border); display:flex; align-items:center; gap:6px; }
.video-card .tag .mic-off{ color: var(--danger); }
.video-card .tag .translate-on{ color: var(--info); display:none; }
.video-card .tag .translate-on.show{ display:inline; }
.video-card .host-tools{ position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:2; }
.video-card .host-tools button{ width:30px; height:30px; border-radius:50%; border:none; font-size:14px; cursor:pointer; background:rgba(0,0,0,0.75); color:#fff; }
.video-card .host-tools button.mute-btn.active{ background: var(--danger); }
.video-card .screen-tag{ position:absolute; bottom:10px; right:10px; background:rgba(63,127,209,0.9); padding:4px 9px; border-radius:6px; font-size:11px; z-index:2; }

  .video-caption{ position:absolute; left:8px; right:8px; bottom:8px; padding:8px 10px; border-radius:9px; background:rgba(8,9,13,0.90); border:1px solid rgba(232,184,75,0.7); color:#fff; z-index:3; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s, transform .2s; text-align:center; text-shadow:0 1px 2px #000; }
  .video-caption.show{ opacity:1; transform:translateY(0); }
  .video-caption .caption-name{ color:var(--gold-bright); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .video-caption .caption-original{ color:#e6e2da; font-size:12px; line-height:1.25; }
  .video-caption .caption-translated{ color:var(--gold-bright); font-weight:700; font-size:16px; line-height:1.25; margin-top:3px; overflow-wrap:anywhere; }
  .global-captions{ display:none; }
  .stage-captions{ position:absolute; left:12px; right:12px; bottom:12px; padding:10px 14px; border-radius:11px; background:rgba(8,9,13,.94); border:1px solid var(--gold); z-index:8; opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .2s, transform .2s; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  .stage-captions.show{ opacity:1; transform:translateY(0); }
  .stage-captions .caption-name{ color:var(--gold-bright); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .stage-captions .caption-original{ color:#e6e2da; font-size:12px; line-height:1.25; }
  .stage-captions .caption-translated{ color:var(--gold-bright); font-size:17px; line-height:1.25; font-weight:700; margin-top:3px; overflow-wrap:anywhere; }
  .wb-canvas-wrap, .stage-screenshare{ position:relative; }

  @media (max-width: 600px){
    .video-caption{ left:5px; right:5px; bottom:5px; padding:7px 8px; }
    .video-caption .caption-translated{ font-size:14px; }
    .stage-captions{ left:6px; right:6px; bottom:6px; padding:8px 10px; }
    .stage-captions .caption-translated{ font-size:15px; }
  }

.translation-bar { background: var(--panel-2); padding: 12px; border-radius: 10px; border: 1px solid #3f7fd1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-size: 14px; margin-top:10px; }
select { background: #000; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 14px; }

/* ---------- participants panel ---------- */
.side-panel{ position:fixed; right:0; top:0; bottom:0; width:300px; max-width:86vw; background:var(--panel-2); border-left:1px solid var(--border); z-index:70; transform:translateX(100%); transition:transform .25s; display:flex; flex-direction:column; }
.side-panel.show{ transform:translateX(0); }
.side-panel-header{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; }
.side-panel-header button{ background:none; border:none; color:var(--cream-dim); font-size:18px; cursor:pointer; }
.participant-row{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,0.05); }
.participant-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--success); }
.participant-row .pname{ flex:1; font-size:13.5px; font-weight:600; }
.participant-row .ptag{ font-size:9px; color:var(--gold); border:1px solid var(--border); padding:2px 6px; border-radius:8px; }
.participant-row .prow-actions{ display:flex; gap:6px; }
.participant-row .prow-actions button{ width:28px; height:28px; border-radius:6px; border:none; background:var(--panel); color:var(--cream); font-size:12px; cursor:pointer; }
.participant-row .prow-actions button.kick{ color:var(--danger); }

/* ---------- chat panel ---------- */
.chat-fab{position:fixed; right:16px; bottom:16px; width:54px; height:54px; border-radius:50%; background:var(--gold); border:none; font-size:22px; box-shadow:0 8px 20px -6px rgba(0,0,0,0.6); z-index:60; cursor:pointer; display:none;}
.chat-fab.show{display:block;}
.chat-fab .badge{ position:absolute; top:-1px; right:-1px; width:14px; height:14px; border-radius:50%; background:var(--danger); border:2px solid #0a0b10; display:none;}
.chat-fab .badge.show{ display:block; }
.chat-panel{ position:fixed; left:0; right:0; bottom:0; max-width:1000px; margin:0 auto; background:var(--panel-2); border-top-left-radius:16px; border-top-right-radius:16px; box-shadow:0 -10px 30px rgba(0,0,0,0.55); z-index:65; display:none; flex-direction:column; max-height:60vh; border:1px solid var(--border); border-bottom:none;}
.chat-panel.show{ display:flex; }
.chat-header{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:13px;}
.chat-header button{ background:none; border:none; color:var(--cream-dim); font-size:16px; cursor:pointer;}
.chat-messages{ flex:1; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:8px; min-height:120px;}
.chat-bubble{ max-width:78%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.35; word-break:break-word;}
.chat-bubble .who{ font-size:10px; color:var(--gold); font-weight:700; margin-bottom:2px; }
.chat-bubble.mine{ align-self:flex-end; background:var(--gold); color:#1a1200; border-bottom-right-radius:2px;}
.chat-bubble.mine .who{ color:#4a3a0a; }
.chat-bubble.theirs{ align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:2px;}
.chat-input-row{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border);}
.chat-input-row input{ flex:1; background:var(--panel); border:1px solid var(--border); color:var(--cream); border-radius:20px; padding:9px 14px; font-size:13px;}
.chat-input-row button{ background:var(--gold); border:none; color:#1a1200; border-radius:20px; padding:0 16px; font-weight:700; font-size:13px; cursor:pointer;}

/* ---------- whiteboard (appears in place of the video grid, synced for everyone) ---------- */
.wb-panel{ display:none; flex-direction:column; margin-top:10px; border-radius:10px; overflow:hidden; border:1.5px solid var(--border); }
.wb-panel.show{ display:flex; }
.wb-toolbar{ display:flex; gap:8px; align-items:center; padding:10px 12px; background:var(--panel-2); border-bottom:1px solid var(--border); flex-wrap:wrap; }
.wb-toolbar button{ background:var(--panel); border:1px solid var(--border); color:var(--cream); border-radius:8px; width:38px; height:38px; font-size:16px; cursor:pointer; }
.wb-toolbar button.active{ background:var(--gold); color:#1a1200; border-color:var(--gold); }
.wb-colors{ display:flex; gap:6px; margin:0 6px; }
.wb-color{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); cursor:pointer; }
.wb-color.selected{ border-color:#fff; box-shadow:0 0 0 2px var(--gold); }
.wb-spacer{ flex:1; }
.wb-canvas-wrap{ height:60vh; min-height:320px; position:relative; background:#f4f1ea; touch-action:none; }
#wbCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.wb-format-bar{ display:none; gap:6px; padding:8px 12px; background:var(--panel-3); border-bottom:1px solid var(--border); flex-wrap:wrap; }
.wb-format-bar.show{ display:flex; }
.wb-format-bar button{ background:var(--panel); border:1px solid var(--border); color:var(--cream); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
.wb-format-bar button.active{ background:var(--gold); color:#1a1200; border-color:var(--gold); }
.wb-format-bar button[data-fmt="delete"]{ margin-left:auto; color:var(--danger); border-color:var(--danger); }

.stage-screenshare{ display:none; margin-top:10px; border-radius:10px; overflow:hidden; border:1.5px solid var(--border); background:#000; position:relative; }
.stage-screenshare.show{ display:block; }
.stage-screenshare video{ width:100%; max-height:70vh; display:block; background:#000; object-fit:contain; }
.stage-screenshare .stage-label{ position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); color:var(--gold-bright); padding:6px 12px; border-radius:6px; font-size:12.5px; font-weight:700; }

.kicked-overlay{ position:fixed; inset:0; background:rgba(10,11,16,0.96); z-index:100; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; padding:20px; }
.kicked-overlay.show{ display:flex; }
.kicked-overlay .msg{ font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--gold-bright); max-width:340px; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--panel-2); border:1px solid var(--gold-bright); color:var(--gold-bright); padding:10px 18px; border-radius:10px; font-size:12.5px; font-weight:600; opacity:0; transition:opacity .25s, transform .25s; z-index:110; pointer-events:none; max-width:90vw; text-align:center; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width: 600px) {
  .subtitles { font-size: 14px; }
  .sub-translated { font-size: 16px; }
  .translation-bar { flex-direction: column; align-items: stretch; }
  select { width: 100%; }
  .side-panel{ width:86vw; }
}
</style>
</head>
<body>

<div class="app">
  <h1>SALA DE REUNIÃO <span style="color:var(--gold-bright)">MULTILINGUE</span></h1>

  <section class="screen active" id="screen-home">
    <div class="card">
      <label style="font-size: 13px; color: var(--cream-dim);">SEU NOME</label>
      <input class="text-input" id="userNameInput" placeholder="Ex: Joel / Sophia..." maxlength="20">

      <div style="margin-top: 12px;">
        <label style="font-size: 13px; color: var(--cream-dim);">CÓDIGO DA SALA (4 DIGITOS)</label>
        <input class="text-input code-input" id="roomCodeInput" maxlength="4" placeholder="1900">
      </div>

      <div class="btn-group">
        <button class="big-btn primary" id="btnJoin">Entrar na Sala</button>
        <button class="big-btn accent" id="btnCreate">Criar Sala</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-room">
    <div class="card">
      <div class="top-bar">
        <div class="room-code-pill"><span style="font-size:11px;color:var(--cream-dim);">SALA</span><span class="code" id="lblRoomCode">----</span></div>
        <div class="participant-count" id="participantCountBtn">👥 <b id="participantCountNum">1</b> conectado(s)</div>
        <button class="leave-btn" id="btnLeave">Sair</button>
      </div>

      <div class="toolbar">
        <button class="tool-btn accent-init" id="btnStartMedia">📸 Ativar câmera e áudio</button>
        <button class="tool-btn" id="btnToggleMic" style="display:none;">🎤 Mic</button>
        <button class="tool-btn" id="btnToggleCam" style="display:none;">📹 Câmera</button>
        <button class="tool-btn" id="btnScreenShare" style="display:none;">🖥️ Compartilhar tela</button>
        <button class="tool-btn" id="btnWhiteboard">✏️ Lousa</button>
        </div>
    </div>

    <div class="translation-bar">
      <strong>🌐 Tradução Simultânea:</strong>
      <label>Eu falo:</label>
      <select id="myLang">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en-US">Inglês (EUA)</option>
        <option value="es-ES">Espanhol</option>
      </select>

      <label>Traduzir para:</label>
      <select id="targetLang">
        <option value="en">Inglês</option>
        <option value="pt">Português</option>
        <option value="es">Espanhol</option>
      </select>

      <button id="btnStartTranslate" style="background:var(--success); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">Ativar Legendas</button>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3 style="margin:0 0 8px; font-size:15px; text-align:left; color:var(--cream-dim);">PARTICIPANTES NA SALA</h3>
      <div class="video-grid" id="videoGrid"></div>

      <div class="wb-panel" id="wbPanel">
        <div class="wb-toolbar">
          <button data-tool="select" title="Selecionar / mover" class="active">🖐️</button>
          <button data-tool="text" title="Texto">🔤</button>
          <button data-tool="hline" title="Linha horizontal">➖</button>
          <button data-tool="vline" title="Linha vertical">┃</button>
          <button data-tool="dline" title="Linha diagonal">╲</button>
          <button data-tool="rect" title="Retângulo">▭</button>
          <button data-tool="circle" title="Círculo">◯</button>
          <button data-tool="arrow" title="Seta">➜</button>
          <button data-tool="eraser" title="Apagar um item (toque nele)">🧹</button>
          <div class="wb-colors">
            <button class="wb-color selected" data-color="#111111" style="background:#111111"></button>
            <button class="wb-color" data-color="#2f6fed" style="background:#2f6fed"></button>
            <button class="wb-color" data-color="#e23b3b" style="background:#e23b3b"></button>
            <button class="wb-color" data-color="#2fa94f" style="background:#2fa94f"></button>
          </div>
          <div class="wb-spacer"></div>
          <button id="wbClear" title="Limpar tudo">🗑️</button>
          <button id="wbClose" title="Voltar para o vídeo">✕</button>
        </div>
        <div class="wb-format-bar" id="wbFormatBar">
          <button data-fmt="bold" title="Negrito"><b>B</b></button>
          <button data-fmt="underline" title="Sublinhado"><u>U</u></button>
          <button data-fmt="smaller" title="Diminuir">A-</button>
          <button data-fmt="bigger" title="Aumentar">A+</button>
          <button data-fmt="delete" title="Excluir este item">🗑️ Excluir item</button>
        </div>
        <div class="wb-canvas-wrap">
          <canvas id="wbCanvas"></canvas>
          <div class="stage-captions" id="wbCaptions" aria-live="polite">
            <div class="caption-name"></div>
            <div class="caption-original"></div>
            <div class="caption-translated"></div>
          </div>
        </div>
      </div>

      <div class="stage-screenshare" id="stageScreenshare">
        <video id="stageVideo" autoplay playsinline></video>
        <div class="stage-label" id="stageLabel">Compartilhando tela</div>
        <div class="stage-captions" id="screenCaptions" aria-live="polite">
          <div class="caption-name"></div>
          <div class="caption-original"></div>
          <div class="caption-translated"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- participants side panel -->
<div class="side-panel" id="sidePanel">
  <div class="side-panel-header"><span>Participantes</span><button id="sidePanelCloseBtn">✕</button></div>
  <div id="participantsList"></div>
</div>

<!-- chat -->
<button class="chat-fab" id="chatFab"><span>💬</span><span class="badge" id="chatBadge"></span></button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-header"><span>Chat da sala</span><button id="chatCloseBtn">✕</button></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input id="chatInput" maxlength="300" placeholder="Escreva uma mensagem...">
    <button id="chatSendBtn">Enviar</button>
  </div>
</div>

<div class="kicked-overlay" id="kickedOverlay">
  <div class="msg" id="kickedMsg">Você foi removido da sala.</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ================= State ================= */
  let peer = null;
  let localStream = null;
  let screenStream = null;
  let myName = '';
  let roomCode = '';
  let myPeerId = '';
  let hostPeerId = '';
  let isHost = false;
  let micEnabled = true;
  let camEnabled = true;
  let isScreenSharing = false;
  let mediaStarted = false;
  let stageMode = 'grid'; // 'grid' | 'whiteboard' | 'screenshare' — what the main area shows
  let presentingPeerId = null; // who is currently screen-sharing (broadcast to everyone)
  const peerStreams = {}; // peerId -> MediaStream, so the stage can grab any peer's video on demand

  const participants = {};   // peerId -> { name, isHost, muted }
  const activeConns = {};    // peerId -> DataConnection
  const activeCalls = {};    // peerId -> MediaConnection
  const myInitiatedConns = new Set(); // peerIds whose data connection we opened
  let wbShapes = [];         // shared whiteboard shapes

  const userNameInput = document.getElementById('userNameInput');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const videoGrid = document.getElementById('videoGrid');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isTranslating = false;

  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
  }

  /* ================= Entry ================= */
  document.getElementById('btnCreate').addEventListener('click', () => {
    const code = roomCodeInput.value.trim() || Math.floor(1000 + Math.random() * 9000).toString();
    isHost = true;
    startRoom(code);
  });

  document.getElementById('btnJoin').addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if(code.length !== 4) return showToast('Digite o código de 4 dígitos!');
    isHost = false;
    startRoom(code);
  });

  function startRoom(code) {
    myName = userNameInput.value.trim() || 'Usuário';
    roomCode = code;
    hostPeerId = 'sala-' + roomCode;
    myPeerId = isHost ? hostPeerId : hostPeerId + '-' + Math.random().toString(36).substr(2, 6);
    peer = new Peer(myPeerId, peerConfig);

    peer.on('open', () => {
      participants[myPeerId] = { name: myName, isHost: isHost, muted: false };
      document.getElementById('lblRoomCode').textContent = roomCode;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-room').classList.add('active');
      document.getElementById('chatFab').classList.add('show');
      renderParticipantsList();

      if(!isHost){
        // Bootstrap: the only peer id a newcomer knows in advance is the host's.
        connectToPeer(hostPeerId, true);
      }
    });

    peer.on('error', (err) => {
      if(err.type === 'unavailable-id') {
        showToast('Essa sala já foi criada! Clique em "Entrar na Sala".');
      } else if(err.type === 'peer-unavailable') {
        // A peer we tried to reach is gone — clean up quietly.
      } else {
        console.error('Peer error', err);
      }
    });

    peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });

    peer.on('connection', (conn) => { setupConnection(conn); });

    peer.on('call', (call) => {
      const streamToSend = isScreenSharing ? screenStream : localStream;
      call.answer(streamToSend || undefined);
      if(!streamToSend) call._answeredEmpty = true; // no camera/mic yet — recover once media starts
      registerCall(call.peer, call);
    });
  }

  /* ================= Mesh connection management =================
     Every peer that ARRIVES only knows the fixed host id in advance.
     The host keeps the authoritative participant roster and, whenever
     someone joins, (a) sends them the full roster + whiteboard state,
     and (b) broadcasts their arrival to everyone already connected.
     Each peer then connects directly to every OTHER peer it learns
     about, using a simple rule (lower peer id initiates) so exactly
     one side opens the connection — this is what makes it a full
     mesh instead of "everyone only sees the host".
  ================================================================== */

  function connectToPeer(otherId, force){
    if(!otherId || otherId === myPeerId) return;
    if(activeConns[otherId]) return; // already connected/connecting
    if(!force && !(myPeerId < otherId)) return; // the other side is responsible for initiating
    const conn = peer.connect(otherId, { reliable: true });
    myInitiatedConns.add(otherId);
    setupConnection(conn);
  }

  function callPeer(otherId){
    if(activeCalls[otherId]) return;
    const streamToSend = isScreenSharing ? screenStream : localStream;
    if(!streamToSend) return;
    const call = peer.call(otherId, streamToSend, { metadata: { name: myName } });
    registerCall(otherId, call);
  }

  function registerCall(otherId, call){
    activeCalls[otherId] = call;
    call.on('stream', (remoteStream) => {
      const name = (participants[otherId] && participants[otherId].name) || 'Participante';
      peerStreams[otherId] = remoteStream;
      addVideoFeed(otherId, name, remoteStream);
      if(otherId === presentingPeerId) applyStageStreamIfAvailable();
    });
    call.on('close', () => { delete activeCalls[otherId]; delete peerStreams[otherId]; removeVideoFeed(otherId); });
    call.on('error', () => {});
  }

  /* ---- unified "stage": grid vs whiteboard vs screen-share, shared for everyone ---- */
  function setStageMode(mode){
    stageMode = mode;
    videoGrid.style.display = mode === 'grid' ? '' : 'none';
    wbPanel.classList.toggle('show', mode === 'whiteboard');
    document.getElementById('stageScreenshare').classList.toggle('show', mode === 'screenshare');
    // A legenda fica dentro do próprio espaço ativo (lousa ou tela).
    document.getElementById('wbCaptions')?.classList.remove('show');
    document.getElementById('screenCaptions')?.classList.remove('show');
    if(lastStageSubtitle){
      renderStageSubtitle(document.getElementById('wbCaptions'), lastStageSubtitle);
      renderStageSubtitle(document.getElementById('screenCaptions'), lastStageSubtitle);
    }
  }

  function applyStageStreamIfAvailable(){
    if(stageMode !== 'screenshare' || !presentingPeerId) return;
    const stream = presentingPeerId === myPeerId ? screenStream : peerStreams[presentingPeerId];
    const label = presentingPeerId === myPeerId ? 'Você está compartilhando a tela' : (peerNameFor(presentingPeerId) + ' está compartilhando a tela');
    if(stream) document.getElementById('stageVideo').srcObject = stream;
    document.getElementById('stageLabel').textContent = label;
  }

  function peerNameFor(id){
    return (participants[id] && participants[id].name) || 'Alguém';
  }

  function setupConnection(conn){
    activeConns[conn.peer] = conn;
    conn.on('open', () => {
      conn.send({ type: 'identity', name: myName, peerId: myPeerId, isHost: isHost });
      if(isHost){
        conn.send({ type: 'roster', participants: getRosterList(), wbShapes: wbShapes });
      }
      // Only the side that opened this data connection also places the media
      // call — the other side just answers. If both sides called each other
      // we'd end up with two redundant peer connections for the same pair.
      if(myInitiatedConns.has(conn.peer)){
        callPeer(conn.peer);
      }
    });
    conn.on('data', (data) => handleData(conn.peer, data));
    conn.on('close', () => { handlePeerLeft(conn.peer); });
    conn.on('error', () => {});
  }

  function getRosterList(){
    return Object.keys(participants).map(id => ({
      peerId: id, name: participants[id].name, isHost: !!participants[id].isHost
    }));
  }

  function handleData(fromId, data){
    if(!data || !data.type) return;
    switch(data.type){
      case 'identity':
        participants[fromId] = { name: data.name, isHost: !!data.isHost, muted: false };
        updateVideoTag(fromId, data.name);
        renderParticipantsList();
        if(isHost){
          broadcastExcept(fromId, { type: 'peer-joined', peerId: fromId, name: data.name });
        }
        break;

      case 'roster':
        (data.participants || []).forEach(p => {
          if(p.peerId === myPeerId) return;
          if(!participants[p.peerId]) participants[p.peerId] = { name: p.name, isHost: p.isHost, muted: false };
          connectToPeer(p.peerId);
        });
        if(Array.isArray(data.wbShapes) && wbShapes.length === 0){
          wbShapes = data.wbShapes;
          redrawWhiteboard();
        }
        renderParticipantsList();
        break;

      case 'peer-joined':
        if(!participants[data.peerId]) participants[data.peerId] = { name: data.name, muted: false };
        connectToPeer(data.peerId);
        renderParticipantsList();
        break;

      case 'peer-left':
        handlePeerLeft(data.peerId, true);
        break;

      case 'chat':
        addChatBubble(data.name, data.text, false);
        break;

      case 'subtitle':
        showSubtitle(data.peerId, data.original, data.translated);
        break;

      case 'mute-request':
        forceMuteMic();
        showToast('Você foi silenciado pelo anfitrião.');
        break;

      case 'mic-state':
        if(participants[fromId]) participants[fromId].muted = !!data.muted;
        updateMicIndicator(fromId, !!data.muted);
        renderParticipantsList();
        break;

      case 'kick':
        handleBeingKicked('Você foi removido da sala pelo anfitrião.');
        break;

      case 'meeting-ended':
        handleBeingKicked('O anfitrião encerrou a reunião.');
        break;

      case 'draw':
        wbShapes.push(data.shape);
        redrawWhiteboard();
        break;

      case 'draw-update': {
        const idx = wbShapes.findIndex(s=>s.id===data.shape.id);
        if(idx>=0) wbShapes[idx] = data.shape; else wbShapes.push(data.shape);
        redrawWhiteboard();
        break;
      }

      case 'draw-delete':
        wbShapes = wbShapes.filter(s=>s.id!==data.id);
        if(wbSelectedId === data.id) selectShape(null);
        redrawWhiteboard();
        break;

      case 'draw-clear':
        wbShapes = [];
        selectShape(null);
        redrawWhiteboard();
        break;

      case 'wb-open':
        setWhiteboardOpen(true, false);
        break;

      case 'wb-close':
        setWhiteboardOpen(false, false);
        break;

      case 'screen-share-start':
        presentingPeerId = data.peerId;
        setStageMode('screenshare', false);
        applyStageStreamIfAvailable();
        break;

      case 'screen-share-stop':
        if(presentingPeerId === data.peerId){
          presentingPeerId = null;
          if(stageMode === 'screenshare') setStageMode('grid', false);
        }
        break;

      case 'translate-state':
        updateTranslateBadge(fromId, !!data.active);
        break;

    }
  }

  function broadcastAll(data){
    Object.values(activeConns).forEach(c => { if(c.open) c.send(data); });
  }
  function broadcastExcept(exceptId, data){
    Object.keys(activeConns).forEach(id => { if(id !== exceptId && activeConns[id].open) activeConns[id].send(data); });
  }
  function sendTo(peerId, data){
    if(activeConns[peerId] && activeConns[peerId].open) activeConns[peerId].send(data);
  }

  function handlePeerLeft(peerId, viaBroadcast){
    if(activeCalls[peerId]){ try{ activeCalls[peerId].close(); }catch(e){} delete activeCalls[peerId]; }
    if(activeConns[peerId]){ try{ activeConns[peerId].close(); }catch(e){} delete activeConns[peerId]; }
    myInitiatedConns.delete(peerId);
    delete participants[peerId];
    delete translateActiveState[peerId];
    delete peerStreams[peerId];
    if(presentingPeerId === peerId){
      presentingPeerId = null;
      if(stageMode === 'screenshare') setStageMode('grid');
    }
    removeVideoFeed(peerId);
    renderParticipantsList();
    if(isHost && !viaBroadcast){
      broadcastAll({ type: 'peer-left', peerId });
    }
  }

  /* ================= Media ================= */
  document.getElementById('btnStartMedia').addEventListener('click', async () => {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      mediaStarted = true;
      addVideoFeed(myPeerId, myName + ' (Você)', localStream, true);
      document.getElementById('btnStartMedia').style.display = 'none';
      document.getElementById('btnToggleMic').style.display = '';
      document.getElementById('btnToggleCam').style.display = '';
      document.getElementById('btnScreenShare').style.display = '';

      // Recover connections that were answered before we had media (they'd
      // never receive our video/audio otherwise), and call anyone we have a
      // data connection with but no media call yet.
      Object.keys(activeConns).forEach(id => {
        const existing = activeCalls[id];
        if(existing && existing._answeredEmpty){
          try{ existing.close(); }catch(e){}
          delete activeCalls[id];
        }
        if(!activeCalls[id]) callPeer(id);
      });
    } catch(e) {
      showToast('Autorize a câmera e o microfone nas configurações do seu navegador.');
    }
  });

  document.getElementById('btnToggleMic').addEventListener('click', () => {
    if(!localStream) return;
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    document.getElementById('btnToggleMic').textContent = micEnabled ? '🎤 Mic' : '🔇 Mic';
    document.getElementById('btnToggleMic').classList.toggle('danger-state', !micEnabled);
    broadcastAll({ type: 'mic-state', muted: !micEnabled });
    updateMicIndicator(myPeerId, !micEnabled);
  });

  document.getElementById('btnToggleCam').addEventListener('click', () => {
    if(!localStream) return;
    camEnabled = !camEnabled;
    localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
    document.getElementById('btnToggleCam').textContent = camEnabled ? '📹 Câmera' : '🚫 Câmera';
    document.getElementById('btnToggleCam').classList.toggle('danger-state', !camEnabled);
  });

  function forceMuteMic(){
    if(!localStream) return;
    micEnabled = false;
    localStream.getAudioTracks().forEach(t => t.enabled = false);
    document.getElementById('btnToggleMic').textContent = '🔇 Mic';
    document.getElementById('btnToggleMic').classList.add('danger-state');
    broadcastAll({ type: 'mic-state', muted: true });
    updateMicIndicator(myPeerId, true);
  }

  /* ---- screen sharing (swaps the outgoing video track on every call) ---- */
  document.getElementById('btnScreenShare').addEventListener('click', async () => {
    if(!isScreenSharing){
      if(presentingPeerId && presentingPeerId !== myPeerId){
        showToast(peerNameFor(presentingPeerId) + ' já está compartilhando a tela.');
        return;
      }
      if(wbOpenState) setWhiteboardOpen(false, true);
      try{
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      }catch(e){ return; }
      isScreenSharing = true;
      const screenTrack = screenStream.getVideoTracks()[0];
      replaceOutgoingVideoTrack(screenTrack);
      updateVideoFeedStream(myPeerId, screenStream);
      document.getElementById('btnScreenShare').textContent = '🛑 Parar compartilhamento';
      document.getElementById('btnScreenShare').classList.add('active');
      screenTrack.onended = stopScreenShare; // user clicked the browser's own "Stop sharing"

      presentingPeerId = myPeerId;
      setStageMode('screenshare');
      applyStageStreamIfAvailable();
      broadcastAll({ type: 'screen-share-start', peerId: myPeerId });
    } else {
      stopScreenShare();
    }
  });

  function stopScreenShare(){
    if(!isScreenSharing) return;
    isScreenSharing = false;
    if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream = null; }
    if(localStream){
      const camTrack = localStream.getVideoTracks()[0];
      replaceOutgoingVideoTrack(camTrack);
      updateVideoFeedStream(myPeerId, localStream);
    }
    document.getElementById('btnScreenShare').textContent = '🖥️ Compartilhar tela';
    document.getElementById('btnScreenShare').classList.remove('active');

    if(presentingPeerId === myPeerId){
      presentingPeerId = null;
      if(stageMode === 'screenshare') setStageMode('grid');
      broadcastAll({ type: 'screen-share-stop', peerId: myPeerId });
    }
  }

  function replaceOutgoingVideoTrack(newTrack){
    Object.values(activeCalls).forEach(call => {
      const pcConn = call.peerConnection;
      if(!pcConn) return;
      const sender = pcConn.getSenders().find(s => s.track && s.track.kind === 'video');
      if(sender && newTrack) sender.replaceTrack(newTrack).catch(()=>{});
    });
  }

  /* ================= Video tiles ================= */
  function addVideoFeed(id, label, stream, isMuted) {
    let card = document.getElementById('vcard-' + id);
    if(card){ updateVideoFeedStream(id, stream); updateVideoTag(id, label); return; }

    card = document.createElement('div');
    card.className = 'video-card';
    card.id = 'vcard-' + id;

    const video = document.createElement('video');
    video.autoplay = true; video.playsInline = true; video.muted = !!isMuted;
    video.srcObject = stream;

    const tag = document.createElement('div');
    tag.className = 'tag'; tag.id = 'tag-' + id;
    tag.innerHTML = '<span class="tag-name">'+escapeHtml(label)+'</span><span class="mic-off" id="micoff-'+id+'" style="display:none;">🔇</span><span class="translate-on" id="translateon-'+id+'" title="Legendas ativas">🌐</span>';

    const caption = document.createElement('div');
    caption.className = 'video-caption';
    caption.id = 'caption-' + id;
    caption.innerHTML = '<div class="caption-name"></div><div class="caption-original"></div><div class="caption-translated"></div>';

    card.appendChild(video); card.appendChild(tag); card.appendChild(caption);

    if(isHost && id !== myPeerId){
      const hostTools = document.createElement('div');
      hostTools.className = 'host-tools';
      hostTools.innerHTML =
        '<button class="mute-btn" title="Silenciar" data-id="'+id+'">🔇</button>'+
        '<button class="kick-btn" title="Remover" data-id="'+id+'">⛔</button>';
      card.appendChild(hostTools);
    }

    videoGrid.appendChild(card);
    if(translateActiveState[id]) updateTranslateBadge(id, true);
    updateParticipantCount();
  }

  function updateVideoFeedStream(id, stream){
    const card = document.getElementById('vcard-' + id);
    if(!card) return;
    const video = card.querySelector('video');
    if(video) video.srcObject = stream;
  }

  function removeVideoFeed(id){
    const card = document.getElementById('vcard-' + id);
    if(card) card.remove();
    updateParticipantCount();
  }

  function updateVideoTag(id, name) {
    const tag = document.querySelector('#tag-' + id + ' .tag-name');
    if(tag) tag.textContent = name;
  }

  function updateMicIndicator(id, muted){
    const el = document.getElementById('micoff-' + id);
    if(el) el.style.display = muted ? '' : 'none';
  }

  const translateActiveState = {}; // peerId -> bool, so badges survive tile re-creation
  function updateTranslateBadge(id, active){
    translateActiveState[id] = active;
    const el = document.getElementById('translateon-' + id);
    if(el) el.classList.toggle('show', active);
  }

  function updateParticipantCount(){
    const n = videoGrid.querySelectorAll('.video-card').length;
    document.getElementById('participantCountNum').textContent = n;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---- host tools: mute / kick ---- */
  videoGrid.addEventListener('click', (e)=>{
    const muteBtn = e.target.closest('.mute-btn');
    const kickBtn = e.target.closest('.kick-btn');
    if(muteBtn){
      const id = muteBtn.dataset.id;
      sendTo(id, { type: 'mute-request' });
      showToast('Pedido de silêncio enviado para ' + ((participants[id]&&participants[id].name)||'participante') + '.');
    }
    if(kickBtn){
      const id = kickBtn.dataset.id;
      const name = (participants[id]&&participants[id].name) || 'participante';
      sendTo(id, { type: 'kick' });
      setTimeout(()=>handlePeerLeft(id), 150);
      showToast(name + ' foi removido da sala.');
    }
  });

  function handleBeingKicked(message){
    document.getElementById('kickedMsg').textContent = message || 'Você foi removido da sala.';
    document.getElementById('kickedOverlay').classList.add('show');
    setTimeout(()=>{
      cleanupAndReturnHome();
      document.getElementById('kickedOverlay').classList.remove('show');
    }, 2200);
  }

  function cleanupAndReturnHome(){
    Object.values(activeCalls).forEach(c=>{ try{c.close();}catch(e){} });
    Object.values(activeConns).forEach(c=>{ try{c.close();}catch(e){} });
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
    if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream = null; }
    if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
    videoGrid.innerHTML = '';
    videoGrid.style.display = '';
    document.getElementById('wbPanel').classList.remove('show');
    document.getElementById('stageScreenshare').classList.remove('show');
    document.getElementById('stageVideo').srcObject = null;
    stageMode = 'grid';
    presentingPeerId = null;
    isScreenSharing = false;
    wbOpenState = false;
    wbSelectedId = null;
    wbShapeIdCounter = 0;
    document.getElementById('btnScreenShare').textContent = '🖥️ Compartilhar tela';
    document.getElementById('btnScreenShare').classList.remove('active');
    document.getElementById('screen-room').classList.remove('active');
    document.getElementById('screen-home').classList.add('active');
    document.getElementById('chatFab').classList.remove('show');
    document.getElementById('btnStartMedia').style.display = '';
    document.getElementById('btnToggleMic').style.display = 'none';
    document.getElementById('btnToggleCam').style.display = 'none';
    document.getElementById('btnScreenShare').style.display = 'none';
    for(const k in participants) delete participants[k];
    for(const k in activeConns) delete activeConns[k];
    for(const k in activeCalls) delete activeCalls[k];
    for(const k in peerStreams) delete peerStreams[k];
    myInitiatedConns.clear();
    for(const k in translateActiveState) delete translateActiveState[k];
    isTranslating = false;
    if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
    document.getElementById('btnStartTranslate').textContent = "Ativar Legendas";
    document.getElementById('btnStartTranslate').style.background = "var(--success)";
    wbShapes = [];
    document.getElementById('chatMessages').innerHTML = '';
  }

  document.getElementById('btnLeave').addEventListener('click', () => {
    if(isHost){
      broadcastAll({ type: 'meeting-ended' });
      showToast('Reunião encerrada para todos os participantes.');
    } else {
      broadcastAll({ type: 'peer-left', peerId: myPeerId });
    }
    cleanupAndReturnHome();
  });

  /* ================= Participants side panel ================= */
  const sidePanel = document.getElementById('sidePanel');
  document.getElementById('participantCountBtn').addEventListener('click', () => {
    sidePanel.classList.add('show');
    renderParticipantsList();
  });
  document.getElementById('sidePanelCloseBtn').addEventListener('click', () => sidePanel.classList.remove('show'));

  function renderParticipantsList(){
    const list = document.getElementById('participantsList');
    const ids = Object.keys(participants);
    list.innerHTML = ids.map(id=>{
      const p = participants[id];
      const actions = (isHost && id !== myPeerId)
        ? '<div class="prow-actions"><button class="mute-btn" data-id="'+id+'">🔇</button><button class="kick prow-kick" data-id="'+id+'">⛔</button></div>'
        : '';
      return '<div class="participant-row"><span class="dot"></span><span class="pname">'+escapeHtml(p.name)+(id===myPeerId?' (você)':'')+'</span>'+
        (p.isHost ? '<span class="ptag">Anfitrião</span>' : '') +
        (p.muted ? '<span title="Silenciado">🔇</span>' : '') +
        actions + '</div>';
    }).join('');
    document.getElementById('participantCountNum').textContent = ids.length;

    list.querySelectorAll('.mute-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sendTo(btn.dataset.id, {type:'mute-request'}); showToast('Pedido de silêncio enviado.'); });
    });
    list.querySelectorAll('.prow-kick').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        sendTo(id, { type:'kick' });
        setTimeout(()=>handlePeerLeft(id), 150);
      });
    });
  }

  /* ================= Chat ================= */
  const chatFab = document.getElementById('chatFab');
  const chatBadge = document.getElementById('chatBadge');
  const chatPanel = document.getElementById('chatPanel');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');

  chatFab.addEventListener('click', ()=>{
    chatPanel.classList.add('show');
    chatBadge.classList.remove('show');
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  });
  document.getElementById('chatCloseBtn').addEventListener('click', ()=> chatPanel.classList.remove('show'));

  function addChatBubble(name, text, mine){
    const b = document.createElement('div');
    b.className = 'chat-bubble ' + (mine ? 'mine' : 'theirs');
    b.innerHTML = (mine ? '' : '<div class="who">'+escapeHtml(name)+'</div>') + escapeHtml(text);
    chatMessagesEl.appendChild(b);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    if(!mine && !chatPanel.classList.contains('show')){
      chatBadge.classList.add('show');

  function sendChatMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    chatInput.value = '';
    addChatBubble(myName, text, true);
    broadcastAll({ type: 'chat', name: myName, text: text.slice(0,300) });
  }
  document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendChatMessage(); });

  /* ================= Whiteboard ================= */
  const wbPanel = document.getElementById('wbPanel');
  const wbCanvas = document.getElementById('wbCanvas');
  const wbCtx = wbCanvas.getContext('2d');
  const wbFormatBar = document.getElementById('wbFormatBar');
  let wbTool = 'select';
  let wbColor = '#111111';
  let wbDrawing = false;
  let wbStart = null;
  let wbPreview = null;
  let wbOpenState = false;
  let wbSelectedId = null;
  let wbDragOffset = null; // {dnx, dny} while dragging a selected shape
  let wbShapeIdCounter = 0;

  function nextShapeId(){ return myPeerId + '_' + Date.now() + '_' + (wbShapeIdCounter++); }

  function setWhiteboardOpen(open, shouldBroadcast){
    if(open && isScreenSharing) stopScreenShare();
    wbOpenState = open;
    if(open) setStageMode('whiteboard', false); else if(stageMode==='whiteboard') setStageMode('grid', false);
    const btn = document.getElementById('btnWhiteboard');
    btn.textContent = open ? '📹 Voltar para o vídeo' : '✏️ Lousa';
    btn.classList.toggle('active', open);
    if(open){ sizeWhiteboardCanvas(); redrawWhiteboard(); } else { selectShape(null); }
    if(shouldBroadcast){ broadcastAll({ type: open ? 'wb-open' : 'wb-close' }); }
  }

  // The whiteboard is a shared teaching tool: whoever opens or closes it
  // switches the view for the whole room, like screen sharing does.

  document.getElementById('btnWhiteboard').addEventListener('click', ()=>{
    setWhiteboardOpen(!wbOpenState, true);
  });
  document.getElementById('wbClose').addEventListener('click', ()=> setWhiteboardOpen(false, true));
  document.getElementById('wbClear').addEventListener('click', ()=>{
    wbShapes = [];
    selectShape(null);
    redrawWhiteboard();
    broadcastAll({ type: 'draw-clear' });
  });

  document.querySelectorAll('.wb-toolbar [data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      wbTool = btn.dataset.tool;
      document.querySelectorAll('.wb-toolbar [data-tool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(wbTool !== 'select') selectShape(null);
    });
  });
  document.querySelectorAll('.wb-color').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      wbColor = sw.dataset.color;
      document.querySelectorAll('.wb-color').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      if(wbSelectedId){ updateSelectedShape({ color: wbColor }); }
    });
  });

  window.addEventListener('resize', ()=>{ if(wbOpenState){ sizeWhiteboardCanvas(); redrawWhiteboard(); } });

  function sizeWhiteboardCanvas(){
    const rect = wbCanvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    wbCanvas.width = rect.width * dpr;
    wbCanvas.height = rect.height * dpr;
    wbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function wbPos(e){
    const rect = wbCanvas.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    return { nx: (pt.clientX - rect.left) / rect.width, ny: (pt.clientY - rect.top) / rect.height };
  }

  function findShapeAt(nx, ny){
    const rect = wbCanvas.getBoundingClientRect();
    const px = nx*rect.width, py = ny*rect.height;
    for(let i = wbShapes.length - 1; i >= 0; i--){
      if(shapeHitTest(wbShapes[i], px, py, rect)) return wbShapes[i];
    }
    return null;
  }

  function shapeHitTest(s, px, py, rect){
    const x1 = s.x1*rect.width, y1 = s.y1*rect.height;
    const x2 = (s.x2!==undefined ? s.x2 : s.x1)*rect.width, y2 = (s.y2!==undefined ? s.y2 : s.y1)*rect.height;
    const pad = 10;
    if(s.tool === 'text'){
      const fontSize = s.fontSize || 20;
      const w = (s.text ? s.text.length : 1) * fontSize * 0.56;
      return px >= x1-4 && px <= x1+w+4 && py >= y1-fontSize-4 && py <= y1+8;
    }
    if(s.tool === 'rect' || s.tool === 'circle'){
      return px >= Math.min(x1,x2)-pad && px <= Math.max(x1,x2)+pad && py >= Math.min(y1,y2)-pad && py <= Math.max(y1,y2)+pad;
    }
    // lines / arrow / hline / vline / dline: distance from point to segment
    const distToSeg = distPointToSegment(px, py, x1, y1, x2, y2);
    return distToSeg <= pad;
  }

  function distPointToSegment(px, py, x1, y1, x2, y2){
    const dx = x2-x1, dy = y2-y1;
    const lenSq = dx*dx + dy*dy;
    let t = lenSq === 0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t*dx, cy = y1 + t*dy;
    return Math.hypot(px-cx, py-cy);
  }

  function selectShape(id){
    wbSelectedId = id;
    const shape = id ? wbShapes.find(s=>s.id===id) : null;
    wbFormatBar.classList.toggle('show', !!shape);
    if(shape){
      wbFormatBar.querySelector('[data-fmt="bold"]').classList.toggle('active', !!shape.bold);
      wbFormatBar.querySelector('[data-fmt="underline"]').classList.toggle('active', !!shape.underline);
    }
    redrawWhiteboard();
  }

  function updateSelectedShape(patch){
    const shape = wbShapes.find(s=>s.id===wbSelectedId);
    if(!shape) return;
    Object.assign(shape, patch);
    redrawWhiteboard();
    broadcastAll({ type: 'draw-update', shape });
  }

  wbFormatBar.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-fmt]');
    if(!btn || !wbSelectedId) return;
    const shape = wbShapes.find(s=>s.id===wbSelectedId);
    if(!shape) return;
    const fmt = btn.dataset.fmt;
    if(fmt === 'bold'){ updateSelectedShape({ bold: !shape.bold }); btn.classList.toggle('active'); }
    else if(fmt === 'underline'){ updateSelectedShape({ underline: !shape.underline }); btn.classList.toggle('active'); }
    else if(fmt === 'bigger'){ updateSelectedShape({ fontSize: Math.min(64, (shape.fontSize||20)+4) }); }
    else if(fmt === 'smaller'){ updateSelectedShape({ fontSize: Math.max(10, (shape.fontSize||20)-4) }); }
    else if(fmt === 'delete'){
      wbShapes = wbShapes.filter(s=>s.id!==wbSelectedId);
      broadcastAll({ type:'draw-delete', id: wbSelectedId });
      selectShape(null);
    }
  });

  function wbPointerDown(e){
    e.preventDefault();
    const p = wbPos(e);

    if(wbTool === 'select'){
      const hit = findShapeAt(p.nx, p.ny);
      if(hit){
        selectShape(hit.id);
        wbDragOffset = { dnx: p.nx - hit.x1, dny: p.ny - hit.y1, x2offset: hit.x2!==undefined ? hit.x2-hit.x1 : null, y2offset: hit.y2!==undefined ? hit.y2-hit.y1 : null };
        wbDrawing = true;
      } else {
        selectShape(null);
      }
      return;
    }

    if(wbTool === 'eraser'){
      const hit = findShapeAt(p.nx, p.ny);
      if(hit){
        wbShapes = wbShapes.filter(s=>s.id!==hit.id);
        redrawWhiteboard();
        broadcastAll({ type:'draw-delete', id: hit.id });
      }
      return;
    }

    if(wbTool === 'text'){
      const text = prompt('Digite o texto:');
      if(text){
        const shape = { id: nextShapeId(), tool:'text', x1:p.nx, y1:p.ny, color: wbColor, text: text.slice(0,120), fontSize: 20, bold:false, underline:false };
        wbShapes.push(shape); redrawWhiteboard(); broadcastAll({ type:'draw', shape });
        // Auto-select so it's easy to move/format right after creating it —
        // this is also how overlapping text gets fixed: drag it apart.
        document.querySelector('.wb-toolbar [data-tool="select"]').click();
        selectShape(shape.id);
      }
      return;
    }

    wbDrawing = true;
    wbStart = p;
  }

  function wbPointerMove(e){
    if(!wbDrawing) return;
    e.preventDefault();
    const p = wbPos(e);

    if(wbTool === 'select' && wbSelectedId && wbDragOffset){
      const shape = wbShapes.find(s=>s.id===wbSelectedId);
      if(shape){
        shape.x1 = p.nx - wbDragOffset.dnx;
        shape.y1 = p.ny - wbDragOffset.dny;
        if(wbDragOffset.x2offset !== null) shape.x2 = shape.x1 + wbDragOffset.x2offset;
        if(wbDragOffset.y2offset !== null) shape.y2 = shape.y1 + wbDragOffset.y2offset;
        redrawWhiteboard();
      }
      return;
    }

    wbPreview = buildShape(wbStart, p);
    redrawWhiteboard();
  }

  function wbPointerUp(e){
    if(!wbDrawing) return;
    wbDrawing = false;

    if(wbTool === 'select'){
      if(wbSelectedId){
        const shape = wbShapes.find(s=>s.id===wbSelectedId);
        if(shape) broadcastAll({ type:'draw-update', shape });
      }
      wbDragOffset = null;
      return;
    }

    const p = wbPos(e);
    const shape = buildShape(wbStart, p);
    wbPreview = null;
    if(shape){
      wbShapes.push(shape);
      redrawWhiteboard();
      broadcastAll({ type:'draw', shape });
    }
  }

  function buildShape(start, end){
    if(!start) return null;
    let x2 = end.nx, y2 = end.ny;
    if(wbTool === 'hline') y2 = start.ny;
    if(wbTool === 'vline') x2 = start.nx;
    return { id: nextShapeId(), tool: wbTool, x1: start.nx, y1: start.ny, x2, y2, color: wbColor };
  }

  wbCanvas.addEventListener('mousedown', wbPointerDown);
  wbCanvas.addEventListener('mousemove', wbPointerMove);
  window.addEventListener('mouseup', wbPointerUp);
  wbCanvas.addEventListener('touchstart', wbPointerDown, { passive:false });
  wbCanvas.addEventListener('touchmove', wbPointerMove, { passive:false });
  wbCanvas.addEventListener('touchend', wbPointerUp);

  function redrawWhiteboard(){
    const rect = wbCanvas.getBoundingClientRect();
    wbCtx.clearRect(0,0,rect.width, rect.height);
    wbCtx.fillStyle = '#f4f1ea';
    wbCtx.fillRect(0,0,rect.width, rect.height);
    wbShapes.forEach(s => drawShape(s, rect, s.id === wbSelectedId));
    if(wbPreview) drawShape(wbPreview, rect, false);
  }

  function drawShape(s, rect, selected){
    const x1 = s.x1*rect.width, y1 = s.y1*rect.height;
    const x2 = (s.x2!==undefined ? s.x2 : s.x1)*rect.width, y2 = (s.y2!==undefined ? s.y2 : s.y1)*rect.height;
    wbCtx.strokeStyle = s.color; wbCtx.fillStyle = s.color; wbCtx.lineWidth = 3; wbCtx.lineCap = 'round';

    if(s.tool === 'text'){
      const fontSize = s.fontSize || 20;
      wbCtx.font = (s.bold ? 'bold ' : '') + fontSize + 'px Inter, sans-serif';
      wbCtx.fillText(s.text, x1, y1);
      if(s.underline){
        const w = wbCtx.measureText(s.text).width;
        wbCtx.beginPath(); wbCtx.moveTo(x1, y1+3); wbCtx.lineTo(x1+w, y1+3); wbCtx.lineWidth = 2; wbCtx.stroke();
      }
      if(selected) drawSelectionBox(x1-4, y1-fontSize-2, (s.text?s.text.length:1)*fontSize*0.56+8, fontSize+10);
      return;
    }
    if(s.tool === 'rect'){
      wbCtx.strokeRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(x2-x1), Math.abs(y2-y1));
      if(selected) drawSelectionBox(Math.min(x1,x2)-6, Math.min(y1,y2)-6, Math.abs(x2-x1)+12, Math.abs(y2-y1)+12);
      return;
    }
    if(s.tool === 'circle'){
      const cx = (x1+x2)/2, cy = (y1+y2)/2, rx = Math.abs(x2-x1)/2, ry = Math.abs(y2-y1)/2;
      wbCtx.beginPath(); wbCtx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2); wbCtx.stroke();
      if(selected) drawSelectionBox(Math.min(x1,x2)-6, Math.min(y1,y2)-6, Math.abs(x2-x1)+12, Math.abs(y2-y1)+12);
      return;
    }
    if(s.tool === 'hline' || s.tool === 'vline' || s.tool === 'dline'){
      wbCtx.beginPath(); wbCtx.moveTo(x1,y1); wbCtx.lineTo(x2,y2); wbCtx.stroke();
      if(selected) drawSelectionBox(Math.min(x1,x2)-6, Math.min(y1,y2)-6, Math.abs(x2-x1)+12, Math.abs(y2-y1)+12);
      return;
    }
    if(s.tool === 'arrow'){
      wbCtx.beginPath(); wbCtx.moveTo(x1,y1); wbCtx.lineTo(x2,y2); wbCtx.stroke();
      const angle = Math.atan2(y2-y1, x2-x1);
      const headLen = 14;
      wbCtx.beginPath();
      wbCtx.moveTo(x2, y2);
      wbCtx.lineTo(x2 - headLen*Math.cos(angle - Math.PI/6), y2 - headLen*Math.sin(angle - Math.PI/6));
      wbCtx.moveTo(x2, y2);
      wbCtx.lineTo(x2 - headLen*Math.cos(angle + Math.PI/6), y2 - headLen*Math.sin(angle + Math.PI/6));
      wbCtx.stroke();
      if(selected) drawSelectionBox(Math.min(x1,x2)-6, Math.min(y1,y2)-6, Math.abs(x2-x1)+12, Math.abs(y2-y1)+12);
      return;
    }
  }

  function drawSelectionBox(x, y, w, h){
    wbCtx.save();
    wbCtx.strokeStyle = '#e8b84b';
    wbCtx.lineWidth = 1.5;
    wbCtx.setLineDash([5,4]);
    wbCtx.strokeRect(x, y, w, h);
    wbCtx.restore();
  }


  /* ================= Speech recognition + translation (kept working) ================= */
  document.getElementById('btnStartTranslate').addEventListener('click', () => {
    if(!SpeechRecognition) return showToast('Utilize o navegador Google Chrome no celular.');

    if(isTranslating) {
      if(recognition) recognition.stop();
      isTranslating = false;
      document.getElementById('btnStartTranslate').textContent = "Ativar Legendas";
      document.getElementById('btnStartTranslate').style.background = "var(--success)";
      broadcastAll({ type: 'translate-state', active: false });
      updateTranslateBadge(myPeerId, false);
      return;
    }

    isTranslating = true;
    document.getElementById('btnStartTranslate').textContent = "Parar Legendas";
    document.getElementById('btnStartTranslate').style.background = "var(--danger)";
    broadcastAll({ type: 'translate-state', active: true });
    updateTranslateBadge(myPeerId, true);

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onstart = () => {
      document.getElementById('btnStartTranslate').classList.add('active');
    };
    recognition.lang = document.getElementById('myLang').value;
    // Chrome Android usa o prefixo webkitSpeechRecognition; manter o idioma
    // explícito evita que o celular tente reconhecer no idioma padrão do sistema.
    recognition.maxAlternatives = 1;

    recognition.onresult = async (event) => {
      let transcript;
      try{
        transcript = event.results[event.results.length - 1][0].transcript.trim();
      }catch(e){ return; }
      if(!transcript || transcript.length < 2) return;

      const targetLang = document.getElementById('targetLang').value;
      const sourceLang = recognition.lang.split('-')[0];

      // Show the original line immediately so something is always visible,
      // even if the translation call is slow or fails (common on flaky
      // mobile connections).
      showSubtitle(myPeerId, transcript, 'traduzindo...');
      broadcastAll({ type: 'subtitle', peerId: myPeerId, original: transcript, translated: '(traduzindo...)' });

      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${sourceLang}|${targetLang}`);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if(data && data.responseData && data.responseData.translatedText) {
          const translatedText = data.responseData.translatedText;
          if(translatedText.includes("NO QUERY SPECIFIED")) return;

          showSubtitle(myPeerId, transcript, translatedText);
          broadcastAll({ type: 'subtitle', peerId: myPeerId, original: transcript, translated: translatedText });
        } else {
          throw new Error('Resposta inesperada do tradutor');
        }
      } catch(e) {
        showToast('Falha ao traduzir: ' + (e && e.message ? e.message : 'erro de rede') + '. Verifique a conexão do celular.');
        showSubtitle(myPeerId, transcript, '(tradução indisponível)');
      }
    };

    recognition.onerror = (e) => {
      // 'no-speech' e 'aborted' são normais em pausas no celular.
      if(e.error === 'no-speech' || e.error === 'aborted') return;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        isTranslating = false;
        document.getElementById('btnStartTranslate').textContent = 'Ativar Legendas';
        document.getElementById('btnStartTranslate').style.background = 'var(--success)';
        showToast('No celular, permita o microfone e o reconhecimento de voz para traduzir.');
        return;
      }
      showToast('Erro no reconhecimento de voz: ' + (e.error || 'desconhecido'));
    };

    recognition.onend = () => {
      if(!isTranslating || !recognition) return;
      setTimeout(() => {
        if(isTranslating && recognition){ try{ recognition.start(); }catch(e){} }
      }, 250);
    };
    try{ recognition.start(); }catch(e){
      isTranslating = false;
      document.getElementById('btnStartTranslate').textContent = 'Ativar Legendas';
      document.getElementById('btnStartTranslate').style.background = 'var(--success)';
      showToast('Toque novamente em “Ativar Legendas” para liberar o microfone do celular.');
    }
  });

  const captionTimers = {};
  let lastStageSubtitle = null;
  function renderStageSubtitle(target, subtitle){
    if(!target || !subtitle) return;
    target.querySelector('.caption-name').textContent = subtitle.name;
    target.querySelector('.caption-original').textContent = subtitle.original;
    target.querySelector('.caption-translated').textContent = subtitle.translated;
    target.classList.toggle('show', (target.id === 'wbCaptions' && stageMode === 'whiteboard') || (target.id === 'screenCaptions' && stageMode === 'screenshare'));
  }
  function showSubtitle(peerId, original, translated) {
    const name = peerId === myPeerId
      ? (myName + ' (Você)')
      : ((participants[peerId] && participants[peerId].name) || 'Alguém');
    const caption = document.getElementById('caption-' + peerId);
    if(caption){
      caption.querySelector('.caption-name').textContent = name;
      caption.querySelector('.caption-original').textContent = original;
      caption.querySelector('.caption-translated').textContent = translated;
      caption.classList.add('show');
      clearTimeout(captionTimers[peerId]);
      captionTimers[peerId] = setTimeout(() => caption.classList.remove('show'), 6000);
    }

    // A legenda é atualizada nas duas superfícies, mas somente a superfície
    // atualmente aberta fica visível. Assim ela permanece dentro da lousa/tela.
    lastStageSubtitle = { name, original, translated };
    ['wbCaptions','screenCaptions'].forEach(id => renderStageSubtitle(document.getElementById(id), lastStageSubtitle));
    clearTimeout(captionTimers.__stage);
    captionTimers.__stage = setTimeout(() => {
      document.getElementById('wbCaptions')?.classList.remove('show');
      document.getElementById('screenCaptions')?.classList.remove('show');
    }, 6000);
    updateTranslateBadge(peerId, true);
  }

})();
</script>
</body>
