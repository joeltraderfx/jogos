<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Confirmando pagamento…</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --panel: #12131a; --gold: #e8b84b; --gold-bright: #ffd876;
  --success: #2fa98c; --danger: #d1352b;
  --cream: #f4ede1; --cream-dim: #9a958d; --border: rgba(232,184,75,0.22);
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px;
  background: radial-gradient(ellipse 90% 60% at 50% -10%, #1c2b3f 0%, #0a0b10 55%);
  min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--cream);
  display: flex; justify-content: center; align-items: center;
}
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 420px; text-align: center; }
h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; font-size: 28px; margin: 0 0 10px; }
p { color: var(--cream-dim); font-size: 14px; line-height: 1.5; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--gold-bright); border-radius: 50%; margin: 14px auto; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.big-btn {
  display: none; width: 100%; height: 50px; border: none; border-radius: 8px; margin-top: 14px; text-decoration: none;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: .04em; cursor: pointer; color: #fff;
  background: linear-gradient(180deg, var(--success) 0%, #1f7d68 100%); align-items: center; justify-content: center;
}
.status-danger { color: var(--danger); }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Confirmando pagamento</h1>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Assim que o PagBank confirmar o pagamento, a sala é liberada automaticamente. Isso costuma levar só alguns segundos.</p>
  <a class="big-btn" id="btnGo">Entrar na sala</a>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const roomCode = params.get('sala');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const spinnerEl = document.getElementById('spinner');
  const btnGo = document.getElementById('btnGo');

  let attempts = 0;
  const MAX_ATTEMPTS = 20; // ~60s de tentativas

  async function poll() {
    if (!roomCode) {
      titleEl.textContent = 'Link incompleto';
      msgEl.textContent = 'Não identifiquei o código da sala nesta URL.';
      spinnerEl.style.display = 'none';
      return;
    }
    attempts++;
    try {
      const res = await fetch('/api/room-status/' + roomCode);
      const data = await res.json();
      if (data.active) {
        titleEl.textContent = 'Pagamento confirmado!';
        msgEl.textContent = 'A sala ' + roomCode + ' já está liberada.';
        spinnerEl.style.display = 'none';
        btnGo.style.display = 'flex';
        btnGo.href = '/index.html?codigo=' + roomCode;
        return;
      }
    } catch (e) { /* tenta de novo no próximo ciclo */ }

    if (attempts >= MAX_ATTEMPTS) {
      titleEl.textContent = 'Ainda processando';
      titleEl.classList.add('status-danger');
      msgEl.textContent = 'Está demorando mais que o esperado. Se você concluiu o pagamento, aguarde mais um pouco e recarregue esta página.';
      spinnerEl.style.display = 'none';
      return;
    }
    setTimeout(poll, 3000);
  }

  poll();
</script>
</body>
</html>
